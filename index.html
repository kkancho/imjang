<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>새암 임장노트</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1a16; --panel:#16241e; --panel2:#1d3129; --line:#2a4438;
  --txt:#eaf3ef; --sub:#9fbcb0; --accent:#2fbf87; --accent2:#26a173;
  --warn:#e5b567; --danger:#e06c6c; --chip:#22392f; --gold:#e8c66a; --blue:#5aa9ff;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
  --navh:58px; --fabh:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{flex:0 0 auto;z-index:20;background:linear-gradient(180deg,#12211c,#12211cee);
  padding:calc(var(--safe-top) + 9px) 14px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:16px;letter-spacing:-.3px}
.logo small{font-weight:500;color:var(--sub);font-size:11px;margin-left:3px}
.spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
.iconbtn:active{transform:scale(.96)}
/* ---------- views ---------- */
.view{flex:1;min-height:0;display:none;flex-direction:column;position:relative}
.view.on{display:flex}
/* ---------- MAP ---------- */
#mapWrap{flex:1;min-height:0;position:relative;overflow:hidden}
#map{position:absolute;inset:0;background:var(--panel2)}
.mapsearch{position:absolute;top:10px;left:10px;right:10px;z-index:6}
.mapsearch .row{display:flex;gap:7px}
.mapsearch input{flex:1;background:#0f1a16ee;border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:11px 13px;outline:none;box-shadow:0 4px 14px #0006}
.mapsearch input:focus{border-color:var(--accent)}
.mapsearch .row button{background:var(--accent);color:#04120b;border:none;border-radius:12px;padding:0 15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px #0006}
.chips{display:flex;gap:6px;margin-top:7px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#0f1a16ee;border:1px solid var(--line);color:var(--sub);
  border-radius:18px;padding:6px 12px;font-size:12.5px;cursor:pointer;box-shadow:0 3px 10px #0005}
.chip.on{background:var(--accent);color:#04120b;border-color:var(--accent);font-weight:700}
.sresults{margin-top:7px;background:#0f1a16f5;border:1px solid var(--line);border-radius:12px;
  max-height:40vh;overflow-y:auto;box-shadow:0 8px 22px #0007;display:none}
.sresults.on{display:block}
.sresult{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.sresult:last-child{border:none}
.sresult:active{background:var(--panel2)}
.sresult b{display:block;font-size:14.5px}
.sresult span{color:var(--sub);font-size:12.5px}
.sresult .tag{display:inline-block;background:var(--chip);color:var(--accent);border-radius:6px;
  padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px}
.mapfabs{position:absolute;right:12px;bottom:58px;z-index:6;display:flex;flex-direction:column;gap:9px;transition:bottom .25s}
.sheetdata.open ~ .mapfabs,.mapfabs.up{bottom:58px}
.mfab{width:44px;height:44px;border-radius:50%;background:#0f1a16ee;border:1px solid var(--line);
  color:var(--accent);font-size:18px;cursor:pointer;box-shadow:0 4px 14px #0007;display:flex;align-items:center;justify-content:center}
.mfab:active{background:var(--chip)}
/* 시세 말풍선 */
.bub{background:#0f1a16f2;border:1.5px solid var(--accent);color:var(--accent);border-radius:9px;
  padding:3px 8px;font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 3px 10px #0007;cursor:pointer;text-align:center;line-height:1.25}
.bub small{display:block;color:var(--sub);font-weight:600;font-size:10px}
.bub.mine{border-color:var(--gold);color:var(--gold)}
.mylabel{background:#2f7dff;border:2px solid #fff;width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 6px #2f7dff44}
/* 하단 데이터 시트 */
.sheetdata{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#0f1a16f7;
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px #0008;
  max-height:56%;display:flex;flex-direction:column;transform:translateY(calc(100% - 42px));transition:transform .25s}
.sheetdata.open{transform:translateY(0)}
.sheetgrip{flex:0 0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.sheetgrip .bar{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheethd{flex:0 0 auto;padding:2px 14px 8px;display:flex;align-items:center;gap:8px}
.sheethd b{font-size:14.5px}
.sheethd span{color:var(--sub);font-size:12px}
.sheetbody2{flex:1;min-height:0;overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch}
.dealrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dealrow:last-child{border:none}
.dealrow .nm{flex:1;min-width:0}
.dealrow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dealrow .nm span{color:var(--sub);font-size:11.5px}
.dealrow .pr{text-align:right;flex:0 0 auto}
.dealrow .pr b{display:block;font-size:14px;color:var(--accent)}
.dealrow .pr span{color:var(--sub);font-size:11px}
.keybox{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:13px;margin:8px 0;font-size:13px;color:var(--sub)}
.keybox b{color:var(--txt)}
.keybox input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:10px;margin-top:9px;outline:none}
.keybox button{width:100%;background:var(--accent);color:#04120b;border:none;border-radius:9px;padding:11px;font-weight:800;margin-top:8px;cursor:pointer}
.mapnotice{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center;gap:12px}
.mapnotice .big{font-size:40px}
.mapnotice p{color:var(--sub);font-size:13.5px;margin:0;line-height:1.6}
.mapnotice input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 12px;outline:none;text-align:center}
.mapnotice button{background:var(--accent);color:#04120b;border:none;border-radius:11px;padding:12px 22px;font-weight:800;cursor:pointer}
/* ---------- LIST ---------- */
.listbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 14px;-webkit-overflow-scrolling:touch}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:11px 13px;outline:none}
.search input:focus{border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--sub);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;cursor:pointer;position:relative;overflow:hidden}
.card:active{border-color:var(--accent)}
.card .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.card .code{display:inline-block;background:var(--chip);color:var(--accent);border:1px solid var(--line);
  border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.card h3{margin:2px 0 3px;font-size:16px}
.card .addr{color:var(--sub);font-size:13px}
.card .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--sub)}
.badge b{color:var(--txt)}
.badge.g{border-color:#2f7a5a;color:#8fe0bd}
.badge.p{border-color:#2f7dff;color:#9dc2ff}
.badge.a{border-color:#b98a2f;color:var(--gold)}
.badge.d{border-color:var(--danger);color:#ffb3b3;font-weight:700}
.rank{position:absolute;top:11px;right:11px;background:var(--gold);color:#3a2c00;font-weight:800;
  border-radius:8px;padding:2px 8px;font-size:12px}
.empty{text-align:center;color:var(--sub);padding:56px 20px}
.empty .big{font-size:42px;margin-bottom:12px}
/* ---------- 하단 고정: 추가 버튼 + 탭바 ---------- */
.fabwrap{flex:0 0 auto;padding:9px 14px 0;background:linear-gradient(180deg,#0f1a1600,#0f1a16 40%)}
.fab{width:100%;background:var(--accent);color:#04120b;border:none;border-radius:14px;
  height:var(--fabh);font-size:15.5px;font-weight:800;box-shadow:0 6px 18px #0007;cursor:pointer}
.fab:active{background:var(--accent2)}
.bottomnav{flex:0 0 auto;display:flex;background:#12211c;border-top:1px solid var(--line);
  padding-bottom:var(--safe-bot);height:calc(var(--navh) + var(--safe-bot));margin-top:8px}
.navbtn{flex:1;background:none;border:none;color:var(--sub);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer;padding:0}
.navbtn i{font-style:normal;font-size:19px;line-height:1}
.navbtn.on{color:var(--accent);font-weight:700}
/* ---------- editor ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.open{display:flex}
.sheethead{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.sheethead b{font-size:16px;flex:1;text-align:center}
.tabbar{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;background:var(--bg)}
.tabbar::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--sub);
  border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#04120b;border-color:var(--accent);font-weight:700}
.sheetbody{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 20px;-webkit-overflow-scrolling:touch}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.grp h4{margin:0 0 10px;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:8px}
.grp h4 .sp{flex:1}
.autofill{background:var(--chip);border:1px solid var(--accent);color:var(--accent);border-radius:9px;
  padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.autofill:active{background:var(--accent);color:#04120b}
.autofill:disabled{opacity:.45}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.field label .src{color:var(--blue);font-size:10.5px;margin-left:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.two{display:flex;gap:9px}.two>*{flex:1}
.three{display:flex;gap:9px}.three>*{flex:1}
.calc{background:var(--chip);border:1px dashed #2f7a5a;border-radius:10px;padding:8px 11px;font-size:13px;color:#8fe0bd;margin-bottom:11px}
.calc b{color:#fff}
.mini{font-size:11.5px;color:var(--sub);margin-top:-4px;margin-bottom:9px}
.addbtn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--accent);
  border-radius:10px;padding:11px;cursor:pointer;font-weight:600;margin-top:2px}
.addbtn:active{background:var(--chip)}
.btnrow{display:flex;gap:8px;margin-bottom:9px}
.btnrow button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  border-radius:10px;padding:11px 6px;cursor:pointer;font-weight:600;font-size:13px}
.btnrow button:active{background:var(--chip)}
.subcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;position:relative}
.subcard .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.media-item .vtag{position:absolute;left:5px;bottom:5px;background:#000a;border-radius:5px;padding:1px 6px;font-size:11px}
.media-item .del{position:absolute;top:4px;right:4px;background:#000b;border:none;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.mediabtns{display:flex;gap:8px;margin-bottom:11px}
.mediabtns label{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px;cursor:pointer;color:var(--accent);font-weight:600}
.savebar{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:11px 14px calc(11px + var(--safe-bot));display:flex;gap:9px}
.savebar button{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.btn-save{background:var(--accent);color:#04120b}
.btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 90px}
.chkline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.chkline:last-child{border:none}
.chkline input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--accent)}
.chkline span{font-size:13.5px}
.locbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;font-size:13px}
.locbox.set{border-color:#2f7a5a;color:#8fe0bd}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--fabh) + 26px + var(--safe-bot));transform:translateX(-50%);
  background:#04120b;border:1px solid var(--accent);color:var(--accent);padding:11px 18px;border-radius:12px;
  z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;font-size:13.5px;max-width:88%;text-align:center}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:12px}
.viewer .close{position:absolute;top:calc(var(--safe-top) + 12px);right:16px;background:#fff2;border:none;color:#fff;
  border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.picker{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
.picker.open{display:flex}
#pickMapWrap{flex:1;min-height:0;position:relative}
#pickMap{position:absolute;inset:0}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:5;pointer-events:none;font-size:34px;filter:drop-shadow(0 3px 5px #000a)}
.pickhint{position:absolute;top:10px;left:10px;right:10px;z-index:5;background:#0f1a16ee;border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--sub);text-align:center}
/* 설정 */
.modal{position:fixed;inset:0;z-index:75;background:#000b;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modalbox{background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:640px;max-height:88%;overflow-y:auto;padding:16px 14px calc(20px + var(--safe-bot))}
.modalbox h3{margin:4px 0 12px;font-size:17px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">새암 임장노트 <small id="ver">v0.4</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" onclick="openSettings()">⚙ 설정</button>
  </header>

  <!-- ===== MAP ===== -->
  <div class="view on" id="mapView">
    <div id="mapWrap">
      <div id="map"></div>
      <div class="mapsearch">
        <div class="row">
          <input id="mq" type="search" placeholder="지역·아파트명 검색" onkeydown="if(event.key==='Enter')doMapSearch()">
          <button onclick="doMapSearch()">검색</button>
        </div>
        <div class="chips" id="chips">
          <button class="chip on" data-deal="trade" onclick="setDealType('trade')">매매</button>
          <button class="chip" data-deal="rent" onclick="setDealType('rent')">전월세</button>
          <button class="chip on" data-mon="3" onclick="setMonths(3)">최근 3개월</button>
          <button class="chip" data-mon="6" onclick="setMonths(6)">6개월</button>
          <button class="chip" data-mon="12" onclick="setMonths(12)">1년</button>
          <button class="chip" id="chipMine" onclick="toggleMineOnly()">내 물건만</button>
        </div>
        <div class="sresults" id="sresults"></div>
      </div>
      <div class="mapfabs">
        <button class="mfab" title="현재 위치" onclick="goMyLocation(true)">◎</button>
        <button class="mfab" title="내 물건 전체" onclick="fitAllPins()">⤢</button>
        <button class="mfab" title="이 지역 실거래 새로고침" onclick="loadDeals(true)">↻</button>
      </div>
      <div class="sheetdata" id="dsheet">
        <div class="sheetgrip" onclick="toggleSheet()"><div class="bar"></div></div>
        <div class="sheethd"><b id="dsTitle">이 지역 실거래</b><span id="dsSub"></span></div>
        <div class="sheetbody2" id="dsBody"></div>
      </div>
      <div class="mapnotice" id="mapnotice" style="display:none"></div>
    </div>
  </div>

  <!-- ===== LIST ===== -->
  <div class="view" id="listView">
    <div class="listbody">
      <div class="search">
        <input id="q" type="search" placeholder="코드·아파트명·지역·사건번호 검색" oninput="renderList()">
      </div>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>등록 물건</span></div>
        <div class="stat"><b id="stPhoto">0</b><span>사진·영상</span></div>
        <div class="stat"><b id="stItv">0</b><span>인터뷰</span></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <!-- 하단 고정 -->
  <div class="fabwrap"><button class="fab" onclick="startAdd()">＋ 임장 물건 추가</button></div>
  <nav class="bottomnav">
    <button class="navbtn on" id="navMap" onclick="setView('map')"><i>🗺</i>지도</button>
    <button class="navbtn" id="navList" onclick="setView('list')"><i>📋</i>목록</button>
  </nav>
</div>

<!-- ===== Editor ===== -->
<div class="sheet" id="sheet">
  <div class="sheethead">
    <button class="iconbtn" onclick="closeEditor()">← 닫기</button>
    <b id="edTitle">새 물건</b>
    <button class="iconbtn" onclick="saveRecord()">저장</button>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="sheetbody" id="sheetbody"></div>
  <div class="savebar">
    <button class="btn-del" id="delBtn" onclick="deleteRecord()" style="display:none">삭제</button>
    <button class="btn-save" onclick="saveRecord()">저장하기</button>
  </div>
</div>

<!-- ===== 위치 확정 ===== -->
<div class="picker" id="picker">
  <div class="sheethead">
    <button class="iconbtn" onclick="closePicker()">← 취소</button>
    <b>지도에서 위치 확정</b>
    <button class="iconbtn" onclick="confirmPick()">확정</button>
  </div>
  <div id="pickMapWrap">
    <div id="pickMap"></div>

<script>
/* ============================================================
   새암 임장노트 v0.4
   - 하단 탭바(지도·목록) + 추가 버튼
   - 지도에 공공데이터 실거래가 표시
   - 편집 화면 공공데이터 자동채움(직접 입력값은 덮어쓰지 않음)
   - 저장되는 좌표는 사용자가 지도에서 확정한 값만 사용
   ============================================================ */
const APP_VERSION='v0.6';
document.getElementById('ver').textContent=APP_VERSION;

const KAKAO_KEY_BUILTIN='dd45c6824d4fce8d61b2449172b73768';
function kakaoKey(){ return KAKAO_KEY_BUILTIN || localStorage.getItem('kakaoKey') || ''; }
/* 공공데이터포털 인증키(디코딩 키). 설정에서 입력. */
function dataKey(){ return localStorage.getItem('dataKey') || ''; }

/* ---------- IndexedDB ---------- */
const DB_NAME='saeam_imjang', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});
    if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=e=>rej(e);
});}
function tx(s,m){return db.transaction(s,m).objectStore(s);}
function idbAll(s){return new Promise(res=>{const o=[];const c=tx(s,'readonly').openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){o.push(cur.value);cur.continue();}else res(o);};});}
function idbGet(s,id){return new Promise(res=>{const r=tx(s,'readonly').get(id);r.onsuccess=()=>res(r.result);});}
function idbPut(s,v){return new Promise(res=>{const r=tx(s,'readwrite').put(v);r.onsuccess=()=>res(true);});}
function idbDel(s,id){return new Promise(res=>{const r=tx(s,'readwrite').delete(id);r.onsuccess=()=>res(true);});}

/* ---------- state ---------- */
let RECORDS=[], cur=null, curTab='basic', curView='map';
let map=null, geocoder=null, places=null, myOverlay=null, tempMarker=null;
let myMarkers=[], bubbles=[];
let pickMap=null, lastPicked=null, pickMode='edit', pendingNew=null;
let lastCenter=null, idleTimer=null;
let dealType='trade', months=3, mineOnly=false;
let dealCache={}, curDeals=[], curLawd=null, curRegionName='';
const SEOUL={lat:37.5665,lng:126.9780};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const REGION_ABBR={'서울':'SEO','부산':'BSN','대구':'DGU','인천':'ICN','광주':'GWJ','대전':'DJN','울산':'ULS',
  '세종':'SJG','경기':'GGD','강원':'GWD','충북':'CHB','충남':'CHN','전북':'JBK','전남':'JNM','경북':'GBK','경남':'GNM','제주':'JJU'};
function makeCode(sido){
  let ab='REG';
  if(sido){for(const k in REGION_ABBR){if(sido.includes(k)){ab=REGION_ABBR[k];break;}}}
  const same=RECORDS.filter(r=>r.code&&r.code.startsWith(ab+'-'));
  let max=0;same.forEach(r=>{const n=parseInt(r.code.split('-')[1]||'0',10);if(n>max)max=n;});
  return ab+'-'+String(max+1).padStart(4,'0');
}

const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const comma=n=>n?Number(n).toLocaleString('ko-KR'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function jeonseRatio(s,j){s=num(s);j=num(j);return s>0?(j/s*100):0;}
function pyeongPrice(p,py){p=num(p);py=num(py);return py>0?(p/py):0;}
function fullAddr(r){return r.road||r.jibun||[r.sido,r.sigungu,r.emd,r.jibun].filter(Boolean).join(' ');}
const m2py = m => m? (num(m)/3.305785) : 0;   // ㎡ → 평
function eok(manwon){const n=num(manwon);if(!n)return '';return n>=10000?(n/10000).toFixed(n%10000?1:0)+'억':n+'만';}

function blank(){return{
  id:uid(),code:'',createdAt:Date.now(),updatedAt:Date.now(),
  aptName:'',sido:'',sigungu:'',emd:'',jibun:'',road:'',bjd:'',
  lat:null,lng:null,
  subway:'',trait:'',moveIn:'',unsold:'',jobs:'',transit:'',amenity:'',nature:'',jimok:'',school:'',story:'',
  far:'',supply:'',exclusive:'',pyeong:'',households:'',parking:'',parkingPer:'',corridor:'',heat:'',
  sale:'',jeonse:'',areaPP:'',grade:'',ranking:'',
  caseNo:'',bidDate:'',apprPrice:'',minPrice:'',failCount:'',takeover:'',
  listings:[],tracks:[],interviews:[],
  memo:'',checklist:{},photos:[],videos:[],auto:{}
};}
const TABS=[['basic','기본·위치·입지'],['complex','단지'],['listing','매물'],['price','가격비교'],['auction','경매'],
  ['track','시세트래킹'],['media','사진·영상'],['interview','인터뷰·메모'],['check','임장 체크리스트']];

/* ============================ INIT ============================ */
(async function(){
  await openDB();
  RECORDS=await idbAll('records');
  buildTabs(); renderList(); initMap();
})();

/* ============================ MAP ============================ */
function loadKakaoSDK(key){
  return new Promise((res,rej)=>{
    if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map)return res(true);
    const s=document.createElement('script');
    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(key)+'&libraries=services&autoload=false';
    s.onload=()=>{try{kakao.maps.load(()=>res(true));}catch(e){rej(e);}};
    s.onerror=()=>rej(new Error('SDK_LOAD_FAIL'));
    document.head.appendChild(s);
  });
}
function showMapNotice(h){const n=$('#mapnotice');n.style.display='flex';n.innerHTML=h;}
function hideMapNotice(){$('#mapnotice').style.display='none';}

async function initMap(){
  const key=kakaoKey();
  if(!key){
    showMapNotice(`<div class="big">🗺️</div><p><b>지도를 쓰려면 카카오 지도 키가 필요합니다.</b></p>
      <input id="keyInput" placeholder="JavaScript 키 붙여넣기"><button onclick="saveKakaoKey()">지도 켜기</button>`);
    return;
  }
  try{ await loadKakaoSDK(key); }
  catch(e){
    showMapNotice(`<div class="big">⚠️</div><p><b>지도를 불러오지 못했습니다.</b><br>인터넷 연결 또는 도메인 등록을 확인해 주세요.</p>
      <p style="font-size:12px">아래 <b>목록</b> 탭의 기능은 정상 동작합니다.</p>`);
    return;
  }
  hideMapNotice();
  const saved=JSON.parse(localStorage.getItem('lastCenter')||'null');
  const c=saved||SEOUL;
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(c.lat,c.lng),level:saved?.level||5});
  geocoder=new kakao.maps.services.Geocoder();
  places=new kakao.maps.services.Places();
  kakao.maps.event.addListener(map,'idle',()=>{
    const ct=map.getCenter();
    lastCenter={lat:ct.getLat(),lng:ct.getLng(),level:map.getLevel()};
    localStorage.setItem('lastCenter',JSON.stringify(lastCenter));
    clearTimeout(idleTimer); idleTimer=setTimeout(()=>loadDeals(false),700);
  });
  kakao.maps.event.addListener(map,'click',()=>{hideResults();});
  refreshPins();
  goMyLocation(false);
  setTimeout(()=>loadDeals(false),1200);
}
function saveKakaoKey(){const v=($('#keyInput').value||'').trim();if(!v)return toast('키를 입력해 주세요');
  localStorage.setItem('kakaoKey',v);hideMapNotice();initMap();}

function goMyLocation(announce){
  if(!map)return;
  if(!navigator.geolocation){if(announce)toast('이 기기에서는 위치를 쓸 수 없습니다');return;}
  if(announce)toast('현재 위치를 찾는 중...');
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude);
    map.setCenter(ll); if(announce)map.setLevel(4);
    if(myOverlay)myOverlay.setMap(null);
    myOverlay=new kakao.maps.CustomOverlay({position:ll,content:'<div class="mylabel"></div>',zIndex:2});
    myOverlay.setMap(map);
    if(announce)toast('현재 위치로 이동했습니다');
  },err=>{ if(announce)toast(err.code===1?'위치 권한이 거부되어 있습니다':'위치를 찾지 못했습니다'); },
  {enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}

/* ---- 내 임장 물건 핀 ---- */
function clearMyPins(){myMarkers.forEach(o=>o.setMap(null));myMarkers=[];}
function refreshPins(){
  if(!map)return;
  clearMyPins();
  RECORDS.filter(r=>r.lat&&r.lng).forEach(r=>{
    const ll=new kakao.maps.LatLng(r.lat,r.lng);
    const ov=new kakao.maps.CustomOverlay({position:ll,yAnchor:1.25,zIndex:4,clickable:true,
      content:makeBubbleEl(`★ ${r.code||''}`, r.aptName||'', true, ()=>openEditor(r.id))});
    ov.setMap(map); myMarkers.push(ov);
  });
}
function makeBubbleEl(main,sub,mine,onClick){
  const d=document.createElement('div');
  d.className='bub'+(mine?' mine':'');
  d.innerHTML=esc(main)+(sub?`<small>${esc(sub)}</small>`:'');
  d.onclick=(e)=>{e.stopPropagation();onClick&&onClick();};
  return d;
}
function fitAllPins(){
  if(!map)return;
  const pts=RECORDS.filter(r=>r.lat&&r.lng);
  if(!pts.length)return toast('위치가 확정된 물건이 없습니다');
  const b=new kakao.maps.LatLngBounds();
  pts.forEach(r=>b.extend(new kakao.maps.LatLng(r.lat,r.lng)));
  map.setBounds(b); toast(pts.length+'개 물건을 표시했습니다');
}

/* ============================ 공공데이터 실거래가 ============================ */
const API='https://apis.data.go.kr/1613000/';
function ymList(n){
  const out=[];const d=new Date();
  for(let i=0;i<n;i++){
    const y=d.getFullYear(), m=d.getMonth()+1;
    out.push(String(y)+String(m).padStart(2,'0'));
    d.setMonth(d.getMonth()-1);
  }
  return out;
}
function xmlItems(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  const err=doc.querySelector('returnAuthMsg,errMsg,cmmMsgHeader');
  if(err&&!doc.querySelector('item'))throw new Error(doc.querySelector('returnAuthMsg')?.textContent||err.textContent||'API 오류');
  return [...doc.querySelectorAll('item')].map(it=>{
    const o={};[...it.children].forEach(c=>o[c.tagName]=(c.textContent||'').trim());return o;
  });
}
async function fetchDeals(lawd,ym,type){
  const k=`${type}_${lawd}_${ym}`;
  if(dealCache[k])return dealCache[k];
  const key=dataKey(); if(!key)throw new Error('NOKEY');
  const path=type==='rent'?'RTMSDataSvcAptRent/getRTMSDataSvcAptRent':'RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade';
  const url=`${API}${path}?serviceKey=${encodeURIComponent(key)}&LAWD_CD=${lawd}&DEAL_YMD=${ym}&numOfRows=1000&pageNo=1`;
  const res=await fetch(url);
  const txt=await res.text();
  if(res.status===401||/SERVICE_KEY_IS_NOT_REGISTERED|Unauthorized/i.test(txt))throw new Error('BADKEY');
  const items=xmlItems(txt).map(o=>({
    apt:(o.aptNm||o.offiNm||'').trim(),
    umd:(o.umdNm||'').trim(),
    jibun:(o.jibun||'').trim(),
    area:num(o.excluUseAr),
    floor:num(o.floor),
    build:o.buildYear||'',
    y:o.dealYear,m:o.dealMonth,d:o.dealDay,
    amount:type==='rent'?num(o.deposit):num(o.dealAmount),
    rent:type==='rent'?num(o.monthlyRent):0,
    cancel:(o.cdealType||'').trim()
  })).filter(x=>x.apt&&!x.cancel);
  dealCache[k]=items;
  return items;
}
function regionCodeOf(lat,lng){
  return new Promise(res=>{
    if(!geocoder)return res(null);
    geocoder.coord2RegionCode(lng,lat,(r,st)=>{
      if(st!==kakao.maps.services.Status.OK||!r||!r.length)return res(null);
      const b=r.find(x=>x.region_type==='B')||r[0];
      res({code:b.code,name:[b.region_1depth_name,b.region_2depth_name].filter(Boolean).join(' ')});
    });
  });
}
function clearBubbles(){bubbles.forEach(o=>o.setMap(null));bubbles=[];}

async function loadDeals(force){
  if(!map)return;
  if(mineOnly){clearBubbles();setSheet('내 물건만 보는 중','지도의 실거래 표시를 껐습니다',
    '<div class="mini">상단 <b>내 물건만</b> 칩을 다시 눌러 실거래 표시를 켤 수 있습니다.</div>');return;}
  if(!dataKey()){
    clearBubbles();
    setSheet('공공데이터 실거래가','키 등록 필요',
      `<div class="keybox"><b>공공데이터포털 인증키를 등록하면</b> 지도에 국토교통부 실거래가가 표시됩니다. 무료이며 심사가 없습니다.
       <input id="dkIn" placeholder="일반 인증키(Decoding) 붙여넣기">
       <button onclick="saveDataKey()">등록하고 불러오기</button></div>
       <div class="mini">참고 · 공공데이터포털이 2026-07-29 19시 ~ 08-02 18시 전환 작업 중이라 이 기간에는 신규 키 발급이 제한됩니다. 기존 키는 정상 동작합니다.</div>`);
    return;
  }
  const c=map.getCenter();
  const reg=await regionCodeOf(c.getLat(),c.getLng());
  if(!reg){setSheet('이 지역 실거래','지역을 확인하지 못했습니다','');return;}
  const lawd=reg.code.slice(0,5);
  if(!force&&lawd===curLawd&&curDeals.length){renderBubbles();return;}
  curLawd=lawd; curRegionName=reg.name;
  setSheet(`${reg.name} 실거래`,'불러오는 중...','<div class="mini">공공데이터포털에서 가져오는 중입니다…</div>');
  try{
    const yms=ymList(months);
    const arrs=await Promise.all(yms.map(ym=>fetchDeals(lawd,ym,dealType).catch(()=>[])));
    curDeals=arrs.flat();
    renderBubbles(); renderDealSheet();
  }catch(e){
    clearBubbles();
    if(e.message==='BADKEY')setSheet('실거래 불러오기 실패','인증키 오류',
      `<div class="keybox"><b>인증키가 유효하지 않습니다.</b> 공공데이터포털의 <b>일반 인증키(Decoding)</b>를 넣었는지, 활용신청이 승인되었는지 확인해 주세요. 발급 직후에는 최대 1시간 뒤부터 동작합니다.
       <input id="dkIn" placeholder="인증키 다시 입력"><button onclick="saveDataKey()">다시 등록</button></div>`);
    else setSheet('실거래 불러오기 실패',e.message||'','<div class="mini">잠시 후 다시 시도해 주세요.</div>');
  }
}
function saveDataKey(){
  const el=$('#dkIn');if(!el)return;
  const v=(el.value||'').trim();if(!v)return toast('인증키를 입력해 주세요');
  localStorage.setItem('dataKey',v); dealCache={}; curLawd=null;
  toast('인증키를 등록했습니다'); loadDeals(true);
}
/* 단지별 집계 → 지도 말풍선 */
function aggregate(deals){
  const m={};
  deals.forEach(d=>{
    const k=d.apt;
    if(!m[k])m[k]={apt:k,umd:d.umd,jibun:d.jibun,n:0,sum:0,latest:null,items:[]};
    const g=m[k];g.n++;g.sum+=d.amount;g.items.push(d);
    const t=`${d.y}${String(d.m).padStart(2,'0')}${String(d.d).padStart(2,'0')}`;
    if(!g.latest||t>g.latest.t)g.latest={t,d};
  });
  Object.values(m).forEach(g=>{
    g.avg=Math.round(g.sum/g.n);
    g.items.sort((a,b)=>(`${b.y}${b.m}${b.d}`).localeCompare(`${a.y}${a.m}${a.d}`));
  });
  return m;
}
function renderBubbles(){
  if(!map||!places)return;
  clearBubbles();
  if(!curDeals.length)return;
  const agg=aggregate(curDeals);
  places.keywordSearch('아파트',(data,st)=>{
    if(st!==kakao.maps.services.Status.OK)return;
    const seen={};
    data.forEach(p=>{
      const nm=(p.place_name||'').replace(/\s/g,'');
      // 실거래 단지명과 느슨하게 매칭
      const hit=Object.keys(agg).find(k=>{
        const a=k.replace(/\s/g,'');
        return nm.includes(a)||a.includes(nm);
      });
      if(!hit||seen[hit])return;
      seen[hit]=1;
      const g=agg[hit];
      const label=dealType==='rent'?`전 ${eok(g.avg)}`:`${eok(g.avg)}`;
      const ov=new kakao.maps.CustomOverlay({
        position:new kakao.maps.LatLng(parseFloat(p.y),parseFloat(p.x)),
        yAnchor:1.3,zIndex:3,clickable:true,
        content:makeBubbleEl(label,`${g.apt.length>9?g.apt.slice(0,9)+'…':g.apt}`,false,()=>showComplex(hit,g,p))
      });
      ov.setMap(map); bubbles.push(ov);
    });
  },{bounds:map.getBounds(),size:15});
}
function setSheet(title,sub,html){
  $('#dsTitle').textContent=title; $('#dsSub').textContent=sub||'';
  $('#dsBody').innerHTML=html;
}
function toggleSheet(){$('#dsheet').classList.toggle('open');}
function renderDealSheet(){
  const agg=aggregate(curDeals);
  const list=Object.values(agg).sort((a,b)=>b.n-a.n).slice(0,40);
  if(!list.length){setSheet(`${curRegionName} 실거래`,`최근 ${months}개월`,'<div class="mini">해당 기간에 신고된 거래가 없습니다.</div>');return;}
  setSheet(`${curRegionName} 실거래`,`최근 ${months}개월 · ${curDeals.length}건`,
    list.map(g=>`<div class="dealrow" onclick="showComplexByName('${esc(g.apt).replace(/'/g,"\\'")}')">
      <div class="nm"><b>${esc(g.apt)}</b><span>${esc(g.umd)} ${esc(g.jibun)} · ${g.n}건</span></div>
      <div class="pr"><b>${dealType==='rent'?'전 ':''}${eok(g.avg)}</b><span>평균</span></div>
    </div>`).join(''));
}
function showComplexByName(nm){const agg=aggregate(curDeals);if(agg[nm])showComplex(nm,agg[nm],null);}
function showComplex(name,g,place){
  $('#dsheet').classList.add('open');
  const rows=g.items.slice(0,25).map(d=>`<div class="dealrow">
      <div class="nm"><b>${m2py(d.area).toFixed(0)}평 <span style="color:var(--sub);font-weight:400">(${d.area}㎡)</span></b>
        <span>${d.y}.${String(d.m).padStart(2,'0')}.${String(d.d).padStart(2,'0')} · ${d.floor}층</span></div>
      <div class="pr"><b>${eok(d.amount)}${d.rent?' / '+d.rent:''}</b><span>${(d.amount/Math.max(m2py(d.area),1)).toFixed(0)} 만/평</span></div>
    </div>`).join('');
  setSheet(esc(name), `${g.n}건 · 평균 ${eok(g.avg)}`,

function parseBunJi(jibun){
  const m=String(jibun||'').match(/(\d+)(?:\s*-\s*(\d+))?\s*$/);
  if(!m)return null;
  return {bun:String(m[1]).padStart(4,'0'), ji:String(m[2]||0).padStart(4,'0'),
          san:/산\s*\d/.test(jibun)?'1':'0'};
}
async function jsonApi(url){
  const r=await fetch(url); const t=await r.text();
  if(r.status===401||/SERVICE_KEY_IS_NOT_REGISTERED|Unauthorized/i.test(t))throw new Error('BADKEY');
  try{return JSON.parse(t);}catch(e){ return {__xml:t}; }
}
function setAuto(field,val){
  if(val===''||val===null||val===undefined)return false;
  if(String(cur[field]||'').trim()!=='')return false;   // 직접 입력값은 덮어쓰지 않는다
  cur[field]=String(val); cur.auto=cur.auto||{}; cur.auto[field]=1; return true;
}
async function autofillComplex(){
  const key=dataKey(); if(!key)return toast('설정에서 공공데이터 인증키를 먼저 등록해 주세요');
  if(!cur.lat||!cur.lng)return toast('먼저 지도에서 위치를 확정해 주세요');
  const btn=$('#afComplex'); if(btn){btn.disabled=true;btn.textContent='불러오는 중…';}
  let filled=0;
  try{
    const reg=await regionCodeOf(cur.lat,cur.lng);
    if(!reg)throw new Error('지역코드를 확인하지 못했습니다');
    const sigunguCd=reg.code.slice(0,5), bjdongCd=reg.code.slice(5,10);
    if(!cur.bjd)cur.bjd=reg.code;
    const bj=parseBunJi(cur.jibun);
    if(!bj)throw new Error('지번주소가 필요합니다 (예: 서울 노원구 공릉동 707)');
    const url=`${API}BldRgstHubService/getBrTitleInfo?serviceKey=${encodeURIComponent(key)}`
      +`&sigunguCd=${sigunguCd}&bjdongCd=${bjdongCd}&platGbCd=${bj.san}&bun=${bj.bun}&ji=${bj.ji}`
      +`&numOfRows=50&pageNo=1&_type=json`;
    const j=await jsonApi(url);
    const items=j?.response?.body?.items?.item;
    const arr=Array.isArray(items)?items:(items?[items]:[]);
    if(!arr.length)throw new Error('건축물대장에서 해당 지번을 찾지 못했습니다');
    // 세대수가 가장 큰 동을 대표로
    arr.sort((a,b)=>num(b.hhldCnt)-num(a.hhldCnt));
    const t=arr[0];
    if(setAuto('far',t.vlRat))filled++;
    if(setAuto('parking',t.totPkngCnt))filled++;
    if(setAuto('households',t.hhldCnt))filled++;
    if(t.useAprDay&&setAuto('moveIn',String(t.useAprDay).replace(/^(\d{4})(\d{2}).*$/,'$1-$2')))filled++;
    if(setAuto('supply',t.totArea))filled++;
    if(num(t.hhldCnt)>0&&num(t.totPkngCnt)>0&&setAuto('parkingPer',(num(t.totPkngCnt)/num(t.hhldCnt)).toFixed(2)))filled++;
    toast(filled?`건축물대장에서 ${filled}개 항목을 채웠습니다`:'새로 채울 빈 항목이 없었습니다');
    renderPanes();
  }catch(e){
    toast(e.message==='BADKEY'?'인증키가 유효하지 않습니다':(e.message||'불러오지 못했습니다'));
  }finally{ const b=$('#afComplex'); if(b){b.disabled=false;b.textContent='⚡ 공공데이터 자동채움';} }
}
async function autofillPrice(){
  const key=dataKey(); if(!key)return toast('설정에서 공공데이터 인증키를 먼저 등록해 주세요');
  if(!cur.lat||!cur.lng)return toast('먼저 지도에서 위치를 확정해 주세요');
  if(!cur.aptName)return toast('아파트/물건명을 먼저 입력해 주세요');
  const btn=$('#afPrice'); if(btn){btn.disabled=true;btn.textContent='불러오는 중…';}
  try{
    const reg=await regionCodeOf(cur.lat,cur.lng);
    if(!reg)throw new Error('지역코드를 확인하지 못했습니다');
    const lawd=reg.code.slice(0,5), yms=ymList(12);
    const [tradeArr,rentArr]=await Promise.all([
      Promise.all(yms.map(ym=>fetchDeals(lawd,ym,'trade').catch(()=>[]))).then(a=>a.flat()),
      Promise.all(yms.map(ym=>fetchDeals(lawd,ym,'rent').catch(()=>[]))).then(a=>a.flat())
    ]);
    const nm=cur.aptName.replace(/\s/g,'');
    const same=x=>{const a=(x.apt||'').replace(/\s/g,'');return a.includes(nm)||nm.includes(a);};
    let tr=tradeArr.filter(same), rn=rentArr.filter(same);
    if(!tr.length&&!rn.length)throw new Error(`최근 1년 실거래에서 "${cur.aptName}"을(를) 찾지 못했습니다`);
    // 평형이 입력되어 있으면 근접 면적만
    const targetPy=num(cur.pyeong);
    if(targetPy>0){
      const near=x=>Math.abs(m2py(x.area)-targetPy)<=2.5;
      if(tr.filter(near).length)tr=tr.filter(near);
      if(rn.filter(near).length)rn=rn.filter(near);
    }
    const sortT=a=>a.sort((x,y)=>(`${y.y}${String(y.m).padStart(2,'0')}${String(y.d).padStart(2,'0')}`)
      .localeCompare(`${x.y}${String(x.m).padStart(2,'0')}${String(x.d).padStart(2,'0')}`));
    sortT(tr);sortT(rn);
    let filled=0;
    if(tr[0]){
      if(setAuto('sale',tr[0].amount))filled++;
      if(!num(cur.pyeong)&&setAuto('pyeong',m2py(tr[0].area).toFixed(1)))filled++;
      if(setAuto('exclusive',tr[0].area))filled++;
    }
    const rnDep=rn.filter(x=>!x.rent);   // 순수 전세
    if(rnDep[0]&&setAuto('jeonse',rnDep[0].amount))filled++;
    // 시세트래킹 자동 생성(월별 평균) — 기존 항목은 유지
    const byMonth={};
    tr.forEach(d=>{const k=`${d.y}.${String(d.m).padStart(2,'0')}`;(byMonth[k]=byMonth[k]||{t:[],r:[]}).t.push(d.amount);});
    rnDep.forEach(d=>{const k=`${d.y}.${String(d.m).padStart(2,'0')}`;(byMonth[k]=byMonth[k]||{t:[],r:[]}).r.push(d.amount);});
    const have={};(cur.tracks||[]).forEach(t=>have[t.label]=1);
    let added=0;
    Object.keys(byMonth).sort().reverse().slice(0,6).forEach(k=>{
      if(have[k])return;
      const g=byMonth[k];
      cur.tracks.push({id:uid(),label:k,
        sale:g.t.length?Math.round(g.t.reduce((a,b)=>a+b,0)/g.t.length):'',
        jeonse:g.r.length?Math.round(g.r.reduce((a,b)=>a+b,0)/g.r.length):''});
      added++;
    });
    toast(`실거래 ${tr.length+rn.length}건 반영 · ${filled}개 항목, 시세 ${added}개 시점 추가`);
    renderPanes();
  }catch(e){
    toast(e.message==='BADKEY'?'인증키가 유효하지 않습니다':(e.message||'불러오지 못했습니다'));
  }finally{ const b=$('#afPrice'); if(b){b.disabled=false;b.textContent='⚡ 실거래가 자동채움';} }
}

function F(label,key,type='text',ph='',opts){
  const val=esc(cur[key]??'');
  const src=(cur.auto&&cur.auto[key])?'<span class="src">공공데이터</span>':'';
  if(type==='textarea')return `<div class="field"><label>${label}${src}</label><textarea data-k="${key}" placeholder="${ph}">${val}</textarea></div>`;
  if(type==='select'){let o=opts.map(x=>`<option ${x===cur[key]?'selected':''}>${x}</option>`).join('');
    return `<div class="field"><label>${label}${src}</label><select data-k="${key}"><option value=""></option>${o}</select></div>`;}
  return `<div class="field"><label>${label}${src}</label><input data-k="${key}" type="${type}" inputmode="${type==='number'?'decimal':'text'}" value="${val}" placeholder="${ph}"></div>`;
}
function bindInputs(root){
  root.querySelectorAll('[data-k]').forEach(el=>{
    const h=()=>{cur[el.dataset.k]=el.value; if(cur.auto)delete cur.auto[el.dataset.k]; liveCalc();};
    el.oninput=h; el.onchange=h;
  });
}
function liveCalc(){
  const r=jeonseRatio(cur.sale,cur.jeonse), pp=pyeongPrice(cur.sale,cur.pyeong), gap=num(cur.areaPP)-pp;
  const box=document.getElementById('priceCalc');
  if(box)box.innerHTML=`전세가율 <b>${r?r.toFixed(1)+'%':'-'}</b> · 물건 평단가 <b>${pp?pp.toFixed(0)+' 만원/평':'-'}</b>`+
    (num(cur.areaPP)?` · 지역대비 차익 <b>${gap>=0?'+':''}${gap.toFixed(0)} 만원/평 ${gap>=0?'(저평가)':'(고평가)'}</b>`:'');
  const ab=document.getElementById('aucCalc');
  if(ab){
    const ap=num(cur.apprPrice), mp=num(cur.minPrice), py=num(cur.pyeong);
    const dd=ddayText(cur.bidDate);
    let s='';
    if(!ap&&!mp)s='감정가와 최저가를 입력하면 최저가율이 자동 계산됩니다.';
    else{
      const rate=ap>0?(mp/ap*100):0, disc=ap-mp;
      s=`최저가율 <b>${rate?rate.toFixed(1)+'%':'-'}</b>`
        +(ap>0&&mp>0?` · 감정가 대비 <b>-${comma(Math.round(disc))} 만원</b>`:'')
        +(num(cur.failCount)?` · 유찰 <b>${num(cur.failCount)}회</b>`:'')
        +(py>0&&mp>0?` · 최저가 평단 <b>${(mp/py).toFixed(0)} 만원/평</b>`:'');
    }
    if(dd)s=`입찰 <b>${dd}</b> · `+s;
    ab.innerHTML=s;
  }
}
/* 입찰일까지 남은 기간 */
function ddays(d){
  if(!d)return null;
  const t=new Date(String(d)+'T00:00:00');
  if(isNaN(t.getTime()))return null;
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((t-today)/86400000);
}
function ddayText(d){
  const n=ddays(d);
  if(n===null)return '';
  if(n===0)return 'D-DAY';
  return n>0?('D-'+n):('종료 '+(-n)+'일 경과');
}

  ['가격','지역 평단가 대비 저평가 여부 판단'],
];
function renderChecklist(){
  const w=$('#chkWrap');if(!w)return;
  cur.checklist=cur.checklist||{};
  let last='',html='';
  CHECKLIST.forEach(([cat,txt],i)=>{
    if(cat!==last){html+=`<div style="color:var(--accent);font-size:12px;margin:12px 0 4px;font-weight:700">${cat}</div>`;last=cat;}
    html+=`<label class="chkline"><input type="checkbox" ${cur.checklist['c'+i]?'checked':''} onchange="cur.checklist['c${i}']=this.checked"><span>${txt}</span></label>`;
  });
  w.innerHTML=html;
}

async function addMedia(e,kind){
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    const isV=(kind==='video')||(kind==='auto'&&f.type.startsWith('video'));
    const mid=uid();
    await idbPut('media',{id:mid,recordId:cur.id,type:isV?'video':'photo',blob:f,name:f.name||'',ts:Date.now()});
    if(isV)cur.videos.push(mid);else cur.photos.push(mid);
  }
  renderMedia();toast(files.length+'개 추가됨');
}
async function renderMedia(){
  const g=$('#mediaGrid');if(!g)return;
  const ids=[...(cur.photos||[]).map(id=>['photo',id]),...(cur.videos||[]).map(id=>['video',id])];
  if(!ids.length){g.innerHTML='<div class="mini" style="grid-column:1/-1">아직 사진·영상이 없습니다.</div>';return;}
  g.innerHTML='';
  for(const [type,id] of ids){
    const m=await idbGet('media',id);if(!m)continue;
    const url=URL.createObjectURL(m.blob);
    const d=document.createElement('div');d.className='media-item';
    d.innerHTML = type==='video'
      ? `<video src="${url}" muted></video><span class="vtag">▶ 영상</span><button class="del" onclick="delMedia('${id}','video',event)">×</button>`
      : `<img src="${url}"><button class="del" onclick="delMedia('${id}','photo',event)">×</button>`;
    d.onclick=ev=>{if(ev.target.classList.contains('del'))return;openViewer(type,url);};
    g.appendChild(d);
  }
}
async function delMedia(id,type,ev){ev.stopPropagation();
  await idbDel('media',id);
  if(type==='video')cur.videos=cur.videos.filter(x=>x!==id);else cur.photos=cur.photos.filter(x=>x!==id);
  renderMedia();
}
function openViewer(t,u){$('#viewerBody').innerHTML=t==='video'?`<video src="${u}" controls autoplay></video>`:`<img src="${u}">`;$('#viewer').classList.add('open');}
function closeViewer(){$('#viewer').classList.remove('open');$('#viewerBody').innerHTML='';}

async function persist(){
  cur.updatedAt=Date.now();
  const idx=RECORDS.findIndex(r=>r.id===cur.id);
  const clean=JSON.parse(JSON.stringify(cur));
  await idbPut('records',clean);
  if(idx>=0)RECORDS[idx]=clean;else RECORDS.push(clean);
  refreshPins();renderList();toast('저장되었습니다');closeEditor();
}
async function saveRecord(){
  if(!cur)return;
  if(!cur.code)cur.code=makeCode(cur.sido);
  if(!cur.lat||!cur.lng)toast('저장했습니다 · 위치를 확정하면 지도에 표시됩니다');
  persist();
}
async function deleteRecord(){
  if(!cur)return;
  if(!confirm('이 물건과 첨부 사진·영상을 모두 삭제할까요?'))return;
  for(const id of [...(cur.photos||[]),...(cur.videos||[])])await idbDel('media',id);
  await idbDel('records',cur.id);
  RECORDS=RECORDS.filter(r=>r.id!==cur.id);
  closeEditor();refreshPins();renderList();toast('삭제되었습니다');
}

/* ============================ 설정 ============================ */

      <div class="mini">국토교통부 실거래가·건축물대장을 불러오는 데 씁니다. 무료이며 심사가 없습니다.
      현재 상태: <b style="color:${dk?'var(--accent)':'var(--warn)'}">${dk?'등록됨 ('+esc(dk.slice(0,10))+'…)':'미등록'}</b></div>
      <div class="field"><label>일반 인증키 (Decoding)</label>
        <input id="setKey" value="${esc(dk)}" placeholder="공공데이터포털에서 발급받은 키"></div>

      </div>
      <div class="mini">공공데이터포털이 2026-07-29 19시 ~ 08-02 18시 전환 작업 중이라 이 기간에는 신규 키 발급이 제한됩니다.</div>
    </div>
    <div class="grp"><h4>백업</h4>
      <div class="mini">기기에만 저장되므로 브라우저 기록을 지우면 함께 삭제됩니다. 주 1회 백업을 권합니다.</div>
      <div class="btnrow">
        <button onclick="exportBackup()">⤓ 백업 내려받기</button>

      지도 · 카카오맵 / 실거래가 · 국토교통부(공공데이터포털)</div>

    <button class="fab" style="height:46px" onclick="closeSettings()">닫기</button>`;
  $('#settings').classList.add('open');

function closeSettings(){$('#settings').classList.remove('open');}
function settingsSaveKey(){
  const v=($('#setKey').value||'').trim();
  if(v)localStorage.setItem('dataKey',v); else localStorage.removeItem('dataKey');
  dealCache={};curLawd=null;
  toast(v?'인증키를 저장했습니다':'인증키를 삭제했습니다');
  closeSettings(); loadDeals(true);
}
function settingsClearKey(){localStorage.removeItem('dataKey');dealCache={};curLawd=null;toast('인증키를 삭제했습니다');closeSettings();loadDeals(true);}

/* ============================ BACKUP ============================ */
function blobToDataURL(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);});}
function dataURLtoBlob(d){const [h,b64]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
async function exportBackup(){
  toast('백업 파일 생성 중...');
  const media=await idbAll('media'); const out=[];
  for(const m of media)out.push({id:m.id,recordId:m.recordId,type:m.type,name:m.name,data:await blobToDataURL(m.blob)});
  const blob=new Blob([JSON.stringify({app:'saeam-imjang',version:APP_VERSION,exportedAt:new Date().toISOString(),records:RECORDS,media:out})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='임장노트_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('백업 완료 · 카톡 나에게 보내기 권장');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const data=JSON.parse(await f.text()); if(!data.records)throw 0;
      if(!confirm('현재 데이터에 백업을 병합합니다. 계속할까요?'))return;
      for(const m of (data.media||[]))await idbPut('media',{id:m.id,recordId:m.recordId,type:m.type,name:m.name,blob:dataURLtoBlob(m.data),ts:Date.now()});
      for(const r of data.records){await idbPut('records',r);if(!RECORDS.find(x=>x.id===r.id))RECORDS.push(r);}
      renderList();refreshPins();toast('복원 완료: '+data.records.length+'건');
    }catch(err){alert('백업 파일을 읽을 수 없습니다.');}
  };
  inp.click();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
