<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>새암 임장노트</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1a16; --panel:#16241e; --panel2:#1d3129; --line:#2a4438;
  --txt:#eaf3ef; --sub:#9fbcb0; --accent:#2fbf87; --accent2:#26a173;
  --warn:#e5b567; --danger:#e06c6c; --chip:#22392f; --gold:#e8c66a;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{flex:0 0 auto;z-index:20;background:linear-gradient(180deg,#12211c,#12211cee);
  padding:calc(var(--safe-top) + 10px) 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo small{font-weight:500;color:var(--sub);font-size:12px;margin-left:3px}
.spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:8px 11px;font-size:13.5px;cursor:pointer}
.iconbtn:active{transform:scale(.96)}
/* view toggle */
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-top:9px}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:8px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#04120b}
/* views */
.view{flex:1;min-height:0;display:none;flex-direction:column;position:relative}
.view.on{display:flex}
/* ---------- MAP VIEW ---------- */
#mapWrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;background:var(--panel2)}
.mapsearch{position:absolute;top:10px;left:10px;right:10px;z-index:6}
.mapsearch .row{display:flex;gap:7px}
.mapsearch input{flex:1;background:#0f1a16ee;border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 13px;outline:none;box-shadow:0 4px 14px #0006}
.mapsearch input:focus{border-color:var(--accent)}
.mapsearch button{background:var(--accent);color:#04120b;border:none;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px #0006}
.sresults{margin-top:7px;background:#0f1a16f5;border:1px solid var(--line);border-radius:12px;
  max-height:44vh;overflow-y:auto;box-shadow:0 8px 22px #0007;display:none}
.sresults.on{display:block}
.sresult{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.sresult:last-child{border:none}
.sresult:active{background:var(--panel2)}
.sresult b{display:block;font-size:14.5px}
.sresult span{color:var(--sub);font-size:12.5px}
.sresult .tag{display:inline-block;background:var(--chip);color:var(--accent);border-radius:6px;
  padding:1px 7px;font-size:11px;font-weight:700;margin-right:6px}
.mapfabs{position:absolute;right:12px;bottom:calc(96px + var(--safe-bot));z-index:6;display:flex;flex-direction:column;gap:9px}
.mfab{width:46px;height:46px;border-radius:50%;background:#0f1a16ee;border:1px solid var(--line);
  color:var(--accent);font-size:19px;cursor:pointer;box-shadow:0 4px 14px #0007;display:flex;align-items:center;justify-content:center}
.mfab:active{background:var(--chip)}
.poicard{position:absolute;left:12px;right:12px;bottom:calc(96px + var(--safe-bot));z-index:7;
  background:#0f1a16f7;border:1px solid var(--accent);border-radius:14px;padding:13px;
  box-shadow:0 10px 26px #0008;display:none}
.poicard.on{display:block}
.poicard .x{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
.poicard .code{display:inline-block;background:var(--chip);color:var(--accent);border:1px solid var(--line);
  border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:5px}
.poicard h3{margin:2px 0 3px;font-size:16px}
.poicard .addr{color:var(--sub);font-size:13px}
.poicard .acts{display:flex;gap:8px;margin-top:11px}
.poicard .acts button{flex:1;border:none;border-radius:10px;padding:11px;font-weight:800;cursor:pointer;font-size:14px}
.pri{background:var(--accent);color:#04120b}
.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)!important}
.mapnotice{position:absolute;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center;gap:12px}
.mapnotice .big{font-size:40px}
.mapnotice p{color:var(--sub);font-size:13.5px;margin:0;line-height:1.6}
.mapnotice input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 12px;outline:none;text-align:center}
.mapnotice button{background:var(--accent);color:#04120b;border:none;border-radius:11px;padding:12px 22px;font-weight:800;cursor:pointer}
.mylabel{background:#2f7dff;border:2px solid #fff;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 6px #2f7dff44}
.pinlabel{background:#0f1a16ee;border:1px solid var(--accent);color:var(--accent);border-radius:8px;
  padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;transform:translateY(-6px)}
/* ---------- LIST VIEW ---------- */
.listbody{flex:1;min-height:0;overflow-y:auto;padding:12px 14px calc(90px + var(--safe-bot));-webkit-overflow-scrolling:touch}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:11px 13px;outline:none}
.search input:focus{border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--sub);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;cursor:pointer;position:relative;overflow:hidden}
.card:active{border-color:var(--accent)}
.card .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.card .code{display:inline-block;background:var(--chip);color:var(--accent);border:1px solid var(--line);
  border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.card h3{margin:2px 0 3px;font-size:16px}
.card .addr{color:var(--sub);font-size:13px}
.card .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--sub)}
.badge b{color:var(--txt)}
.badge.g{border-color:#2f7a5a;color:#8fe0bd}
.badge.p{border-color:#2f7dff;color:#9dc2ff}
.rank{position:absolute;top:11px;right:11px;background:var(--gold);color:#3a2c00;font-weight:800;
  border-radius:8px;padding:2px 8px;font-size:12px}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty .big{font-size:44px;margin-bottom:12px}
/* ---------- shared ---------- */
.fab{position:absolute;left:14px;right:14px;bottom:calc(16px + var(--safe-bot));
  z-index:30;background:var(--accent);color:#04120b;border:none;border-radius:16px;
  padding:15px 26px;font-size:16px;font-weight:800;box-shadow:0 8px 24px #0008;cursor:pointer}
.fab:active{background:var(--accent2)}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.open{display:flex}
.sheethead{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.sheethead b{font-size:16px;flex:1;text-align:center}
.tabbar{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;background:var(--bg)}
.tabbar::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--sub);
  border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#04120b;border-color:var(--accent);font-weight:700}
.sheetbody{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 20px;-webkit-overflow-scrolling:touch}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.grp h4{margin:0 0 10px;font-size:14px;color:var(--accent)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.two{display:flex;gap:9px}.two>*{flex:1}
.three{display:flex;gap:9px}.three>*{flex:1}
.calc{background:var(--chip);border:1px dashed #2f7a5a;border-radius:10px;padding:8px 11px;font-size:13px;color:#8fe0bd;margin-bottom:11px}
.calc b{color:#fff}
.mini{font-size:11.5px;color:var(--sub);margin-top:-4px;margin-bottom:9px}
.addbtn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--accent);
  border-radius:10px;padding:11px;cursor:pointer;font-weight:600;margin-top:2px}
.addbtn:active{background:var(--chip)}
.btnrow{display:flex;gap:8px;margin-bottom:9px}
.btnrow button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--accent);
  border-radius:10px;padding:11px 6px;cursor:pointer;font-weight:600;font-size:13px}
.btnrow button:active{background:var(--chip)}
.subcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;position:relative}
.subcard .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.media-item .vtag{position:absolute;left:5px;bottom:5px;background:#000a;border-radius:5px;padding:1px 6px;font-size:11px}
.media-item .del{position:absolute;top:4px;right:4px;background:#000b;border:none;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.mediabtns{display:flex;gap:8px;margin-bottom:11px}
.mediabtns label{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px;cursor:pointer;color:var(--accent);font-weight:600}
.savebar{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:11px 14px calc(11px + var(--safe-bot));display:flex;gap:9px}
.savebar button{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.btn-save{background:var(--accent);color:#04120b}
.btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 90px}
.chkline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.chkline:last-child{border:none}
.chkline input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--accent)}
.chkline span{font-size:13.5px}
.locbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;font-size:13px}
.locbox.set{border-color:#2f7a5a;color:#8fe0bd}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translateX(-50%);
  background:#04120b;border:1px solid var(--accent);color:var(--accent);padding:11px 20px;border-radius:12px;
  z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;font-size:14px;max-width:88%;text-align:center}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:12px}
.viewer .close{position:absolute;top:calc(var(--safe-top) + 12px);right:16px;background:#fff2;border:none;color:#fff;
  border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
/* picker */
.picker{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
.picker.open{display:flex}
#pickMapWrap{flex:1;min-height:0;position:relative}
#pickMap{position:absolute;inset:0}
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:5;pointer-events:none;font-size:34px;filter:drop-shadow(0 3px 5px #000a)}
.pickhint{position:absolute;top:10px;left:10px;right:10px;z-index:5;background:#0f1a16ee;border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div class="logo">새암 임장노트 <small id="ver">v0.2</small></div>
      <div class="spacer"></div>
      <button class="iconbtn" onclick="openBackup()">⤓ 백업</button>
    </div>
    <div class="seg">
      <button id="segMap" class="on" onclick="setView('map')">🗺 지도</button>
      <button id="segList" onclick="setView('list')">📋 목록</button>
    </div>
  </header>

  <!-- ===== MAP VIEW ===== -->
  <div class="view on" id="mapView">
    <div id="mapWrap">
      <div id="map"></div>
      <div class="mapsearch">
        <div class="row">
          <input id="mq" type="search" placeholder="주소·아파트명 검색 (예: 공릉동 707)"
                 onkeydown="if(event.key==='Enter')doMapSearch()">
          <button onclick="doMapSearch()">검색</button>
        </div>
        <div class="sresults" id="sresults"></div>
      </div>
      <div class="mapfabs">
        <button class="mfab" title="현재 위치" onclick="goMyLocation(true)">◎</button>
        <button class="mfab" title="등록 물건 전체 보기" onclick="fitAllPins()">⤢</button>
      </div>
      <div class="poicard" id="poicard"></div>
      <div class="mapnotice" id="mapnotice" style="display:none"></div>
    </div>
    <button class="fab" onclick="addHere()">＋ 임장 물건 추가</button>
  </div>

  <!-- ===== LIST VIEW ===== -->
  <div class="view" id="listView">
    <div class="listbody">
      <div class="search">
        <input id="q" type="search" placeholder="코드·아파트명·지역 검색 (예: SEO-0001, 공릉)" oninput="renderList()">
      </div>
      <div class="stats">
        <div class="stat"><b id="stTotal">0</b><span>등록 물건</span></div>
        <div class="stat"><b id="stPhoto">0</b><span>사진·영상</span></div>
        <div class="stat"><b id="stItv">0</b><span>인터뷰</span></div>
      </div>
      <div id="list"></div>
    </div>
    <button class="fab" onclick="openEditor()">＋ 임장 물건 추가</button>
  </div>
</div>

<!-- ===== Editor Sheet ===== -->
<div class="sheet" id="sheet">
  <div class="sheethead">
    <button class="iconbtn" onclick="closeEditor()">← 닫기</button>
    <b id="edTitle">새 물건</b>
    <button class="iconbtn" onclick="saveRecord()">저장</button>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="sheetbody" id="sheetbody"></div>
  <div class="savebar">
    <button class="btn-del" id="delBtn" onclick="deleteRecord()" style="display:none">삭제</button>
    <button class="btn-save" onclick="saveRecord()">저장하기</button>
  </div>
</div>

<!-- ===== Location picker ===== -->
<div class="picker" id="picker">
  <div class="sheethead">
    <button class="iconbtn" onclick="closePicker()">← 취소</button>
    <b>지도에서 위치 지정</b>
    <button class="iconbtn" onclick="confirmPick()">확인</button>
  </div>
  <div id="pickMapWrap">
    <div id="pickMap"></div>
    <div class="crosshair">📍</div>
    <div class="pickhint">지도를 움직여 핀을 물건 위치에 맞춘 뒤 확인을 누르세요</div>
  </div>
  <div class="savebar"><button class="btn-save" onclick="confirmPick()">이 위치로 지정</button></div>
</div>

<div class="viewer" id="viewer" onclick="if(event.target.id==='viewer')closeViewer()">
  <button class="close" onclick="closeViewer()">×</button>
  <div id="viewerBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   새암 임장노트 v0.2 — 지도(카카오맵) + 로컬 우선(IndexedDB)
   ============================================================ */
const APP_VERSION='v0.2';
document.getElementById('ver').textContent=APP_VERSION;

/* 카카오 JavaScript 키.
   배포본에는 여기에 키를 넣습니다. 비어 있으면 앱 안에서 직접 입력할 수 있습니다. */
const KAKAO_KEY_BUILTIN='dd45c6824d4fce8d61b2449172b73768';
function kakaoKey(){ return KAKAO_KEY_BUILTIN || localStorage.getItem('kakaoKey') || ''; }

/* ---------- IndexedDB (저장소 추상화: 클라우드 이관 시 이 4개만 교체) ---------- */
const DB_NAME='saeam_imjang', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});
    if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=e=>rej(e);
});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function idbAll(store){return new Promise((res)=>{const out=[];const c=tx(store,'readonly').openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};});}
function idbGet(store,id){return new Promise(res=>{const r=tx(store,'readonly').get(id);r.onsuccess=()=>res(r.result);});}
function idbPut(store,val){return new Promise(res=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>res(true);});}
function idbDel(store,id){return new Promise(res=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res(true);});}

/* ---------- state ---------- */
let RECORDS=[], cur=null, curTab='basic', curView='map';
let map=null, geocoder=null, places=null, markers=[], myOverlay=null, tempMarker=null;
let pickMap=null, lastPicked=null;
let lastCenter=null;
const SEOUL={lat:37.5665,lng:126.9780};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- code generator ---------- */
const REGION_ABBR={'서울':'SEO','부산':'BSN','대구':'DGU','인천':'ICN','광주':'GWJ','대전':'DJN','울산':'ULS',
  '세종':'SJG','경기':'GGD','강원':'GWD','충북':'CHB','충남':'CHN','전북':'JBK','전남':'JNM','경북':'GBK',
  '경남':'GNM','제주':'JJU'};
function makeCode(sido){
  let ab='REG';
  if(sido){for(const k in REGION_ABBR){if(sido.includes(k)){ab=REGION_ABBR[k];break;}}}
  const same=RECORDS.filter(r=>r.code&&r.code.startsWith(ab+'-'));
  let max=0;same.forEach(r=>{const n=parseInt(r.code.split('-')[1]||'0',10);if(n>max)max=n;});
  return ab+'-'+String(max+1).padStart(4,'0');
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const comma=n=>n?Number(n).toLocaleString('ko-KR'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function jeonseRatio(sale,jeonse){sale=num(sale);jeonse=num(jeonse);return sale>0?(jeonse/sale*100):0;}
function pyeongPrice(price,py){price=num(price);py=num(py);return py>0?(price/py):0;}
function fullAddr(r){return r.road||r.jibun||[r.sido,r.sigungu,r.emd,r.jibun].filter(Boolean).join(' ');}

/* ---------- blank record ---------- */
function blank(){return{
  id:uid(),code:'',createdAt:Date.now(),updatedAt:Date.now(),
  aptName:'',sido:'',sigungu:'',emd:'',jibun:'',road:'',bjd:'',
  lat:null,lng:null,
  subway:'',trait:'',moveIn:'',unsold:'',jobs:'',transit:'',amenity:'',nature:'',jimok:'',school:'',story:'',
  far:'',supply:'',exclusive:'',pyeong:'',households:'',parking:'',parkingPer:'',corridor:'',
  sale:'',jeonse:'',areaPP:'',grade:'',ranking:'',
  listings:[],tracks:[],interviews:[],
  memo:'',checklist:{},photos:[],videos:[]
};}

const TABS=[
  ['basic','기본·위치·입지'],['complex','단지'],['listing','매물'],
  ['price','가격비교'],['track','시세트래킹'],['media','사진·영상'],
  ['interview','인터뷰·메모'],['check','임장 체크리스트']
];

/* ============================ INIT ============================ */
(async function(){
  await openDB();
  RECORDS=await idbAll('records');
  buildTabs();
  renderList();
  initMap();
})();

/* ============================ KAKAO MAP ============================ */
function loadKakaoSDK(key){
  return new Promise((res,rej)=>{
    if(window.kakao&&window.kakao.maps&&window.kakao.maps.Map)return res(true);
    const s=document.createElement('script');
    s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(key)+'&libraries=services&autoload=false';
    s.onload=()=>{try{kakao.maps.load(()=>res(true));}catch(e){rej(e);}};
    s.onerror=()=>rej(new Error('SDK_LOAD_FAIL'));
    document.head.appendChild(s);
  });
}
function showMapNotice(html){const n=$('#mapnotice');n.style.display='flex';n.innerHTML=html;}
function hideMapNotice(){$('#mapnotice').style.display='none';}

async function initMap(){
  const key=kakaoKey();
  if(!key){
    showMapNotice(`<div class="big">🗺️</div>
      <p><b>지도를 쓰려면 카카오 지도 키가 필요합니다.</b><br>
      developers.kakao.com 에서 앱을 만들고 <b>JavaScript 키</b>를 발급받아<br>아래에 붙여넣으세요. 한 번만 하면 됩니다.</p>
      <input id="keyInput" placeholder="JavaScript 키 붙여넣기" autocapitalize="off" autocorrect="off">
      <button onclick="saveKey()">지도 켜기</button>
      <p style="font-size:12px">키가 없어도 목록·기록·사진 기능은 모두 정상 동작합니다.</p>`);
    return;
  }
  try{
    await loadKakaoSDK(key);
  }catch(e){
    showMapNotice(`<div class="big">⚠️</div>
      <p><b>지도를 불러오지 못했습니다.</b><br>
      인터넷 연결을 확인해 주세요. 키가 잘못되었거나 카카오 개발자 사이트에<br>
      이 사이트 도메인이 등록되지 않은 경우에도 발생합니다.</p>
      <button onclick="resetKey()">키 다시 입력</button>
      <p style="font-size:12px">지도 외 기능은 정상 동작합니다. 상단에서 <b>목록</b>을 눌러 계속 사용하세요.</p>`);
    return;
  }
  hideMapNotice();
  const saved=JSON.parse(localStorage.getItem('lastCenter')||'null');
  const c=saved||SEOUL;
  map=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(c.lat,c.lng),level:saved?.level||5});
  geocoder=new kakao.maps.services.Geocoder();
  places=new kakao.maps.services.Places();
  kakao.maps.event.addListener(map,'idle',()=>{
    const ct=map.getCenter();
    lastCenter={lat:ct.getLat(),lng:ct.getLng(),level:map.getLevel()};
    localStorage.setItem('lastCenter',JSON.stringify(lastCenter));
  });
  kakao.maps.event.addListener(map,'click',()=>{hideResults();$('#poicard').classList.remove('on');});
  refreshPins();
  goMyLocation(false);   // 앱을 켜면 현재 위치로
}
function saveKey(){
  const v=($('#keyInput').value||'').trim();
  if(!v)return toast('키를 입력해 주세요');
  localStorage.setItem('kakaoKey',v);
  hideMapNotice();initMap();
}
function resetKey(){localStorage.removeItem('kakaoKey');initMap();}

/* ---- 현재 위치 ---- */
function goMyLocation(announce){
  if(!map)return;
  if(!navigator.geolocation){if(announce)toast('이 기기에서는 위치를 쓸 수 없습니다');return;}
  if(announce)toast('현재 위치를 찾는 중...');
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude);
    map.setCenter(ll);
    if(announce)map.setLevel(4);
    if(myOverlay)myOverlay.setMap(null);
    myOverlay=new kakao.maps.CustomOverlay({position:ll,content:'<div class="mylabel"></div>',zIndex:2});
    myOverlay.setMap(map);
    if(announce)toast('현재 위치로 이동했습니다');
  },err=>{
    if(announce){
      toast(err.code===1?'위치 권한이 거부되어 있습니다':'위치를 찾지 못했습니다');
    }
  },{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
}

/* ---- 핀 ---- */
function clearPins(){markers.forEach(m=>{m.marker.setMap(null);if(m.label)m.label.setMap(null);});markers=[];}
function refreshPins(){
  if(!map)return;
  clearPins();
  RECORDS.filter(r=>r.lat&&r.lng).forEach(r=>{
    const ll=new kakao.maps.LatLng(r.lat,r.lng);
    const marker=new kakao.maps.Marker({position:ll,map:map,title:r.aptName||r.code});
    const label=new kakao.maps.CustomOverlay({position:ll,yAnchor:2.1,zIndex:1,
      content:'<div class="pinlabel">'+esc(r.code||r.aptName||'')+'</div>'});
    label.setMap(map);
    kakao.maps.event.addListener(marker,'click',()=>showPoi(r.id));
    markers.push({marker,label,id:r.id});
  });
}
function showPoi(id){
  const r=RECORDS.find(x=>x.id===id);if(!r)return;
  const ratio=jeonseRatio(r.sale,r.jeonse),pp=pyeongPrice(r.sale,r.pyeong);
  $('#poicard').innerHTML=`<button class="x" onclick="document.getElementById('poicard').classList.remove('on')">×</button>
    <span class="code">${esc(r.code||'코드미지정')}</span>
    <h3>${esc(r.aptName||'(이름 미입력)')}</h3>
    <div class="addr">${esc(fullAddr(r)||'주소 미입력')}</div>
    <div class="row" style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
      ${r.pyeong?`<span class="badge"><b>${esc(r.pyeong)}</b>평</span>`:''}
      ${r.sale?`<span class="badge">매매 <b>${comma(r.sale)}</b></span>`:''}
      ${ratio?`<span class="badge g">전세가율 <b>${ratio.toFixed(0)}%</b></span>`:''}
      ${pp?`<span class="badge">평단 <b>${pp.toFixed(0)}</b></span>`:''}
    </div>
    <div class="acts">
      <button class="sec" onclick="document.getElementById('poicard').classList.remove('on')">닫기</button>
      <button class="pri" onclick="openEditor('${r.id}')">상세 보기</button>
    </div>`;
  $('#poicard').classList.add('on');
  map.panTo(new kakao.maps.LatLng(r.lat,r.lng));
}
function fitAllPins(){
  if(!map)return;
  const pts=RECORDS.filter(r=>r.lat&&r.lng);
  if(!pts.length)return toast('위치가 지정된 물건이 없습니다');
  const b=new kakao.maps.LatLngBounds();
  pts.forEach(r=>b.extend(new kakao.maps.LatLng(r.lat,r.lng)));
  map.setBounds(b);
  toast(pts.length+'개 물건을 표시했습니다');
}

/* ---- 검색 ---- */
function hideResults(){$('#sresults').classList.remove('on');}
function doMapSearch(){
  const q=($('#mq').value||'').trim();
  if(!q)return;
  if(!map)return toast('지도가 아직 준비되지 않았습니다');
  const out=[];
  // 1) 내가 등록한 물건 먼저
  RECORDS.forEach(r=>{
    const hay=[r.code,r.aptName,r.sido,r.sigungu,r.emd,r.jibun,r.road].join(' ').toLowerCase();
    if(hay.includes(q.toLowerCase()))out.push({kind:'saved',id:r.id,title:r.aptName||r.code,sub:fullAddr(r),lat:r.lat,lng:r.lng});
  });
  // 2) 주소 검색 → 3) 키워드(장소) 검색
  geocoder.addressSearch(q,(res,status)=>{
    if(status===kakao.maps.services.Status.OK){
      res.slice(0,5).forEach(a=>out.push({kind:'addr',title:a.road_address?a.road_address.address_name:a.address_name,
        sub:a.address_name,lat:parseFloat(a.y),lng:parseFloat(a.x)}));
    }
    places.keywordSearch(q,(pres,pstatus)=>{
      if(pstatus===kakao.maps.services.Status.OK){
        pres.slice(0,7).forEach(p=>out.push({kind:'place',title:p.place_name,
          sub:p.road_address_name||p.address_name,lat:parseFloat(p.y),lng:parseFloat(p.x)}));
      }
      renderResults(out,q);
    });
  });
}
function renderResults(list,q){
  const el=$('#sresults');
  if(!list.length){el.innerHTML='<div class="sresult"><b>검색 결과가 없습니다</b><span>지번주소·도로명주소·아파트명으로 다시 시도해 보세요</span></div>';el.classList.add('on');return;}
  el.innerHTML=list.map((r,i)=>{
    const tag=r.kind==='saved'?'내 물건':(r.kind==='addr'?'주소':'장소');
    return `<div class="sresult" onclick="pickResult(${i})">
      <b><span class="tag">${tag}</span>${esc(r.title)}</b><span>${esc(r.sub||'')}</span></div>`;
  }).join('');
  el._list=list;
  el.classList.add('on');
}
function pickResult(i){
  const list=$('#sresults')._list||[];const r=list[i];if(!r)return;
  hideResults();
  if(r.kind==='saved'){
    if(!r.lat||!r.lng){toast('이 물건은 위치가 지정되어 있지 않습니다');openEditor(r.id);return;}
    map.setLevel(3);showPoi(r.id);return;
  }
  const ll=new kakao.maps.LatLng(r.lat,r.lng);
  map.setLevel(3);map.setCenter(ll);
  if(tempMarker)tempMarker.setMap(null);
  tempMarker=new kakao.maps.Marker({position:ll,map:map,zIndex:5});
  lastPicked=r;
  $('#poicard').innerHTML=`<button class="x" onclick="clearTemp()">×</button>
    <span class="code">검색 위치</span>
    <h3>${esc(r.title)}</h3>
    <div class="addr">${esc(r.sub||'')}</div>
    <div class="acts">
      <button class="sec" onclick="clearTemp()">닫기</button>
      <button class="pri" onclick="addPicked()">여기에 물건 추가</button>
    </div>`;
  $('#poicard').classList.add('on');
}
function clearTemp(){if(tempMarker){tempMarker.setMap(null);tempMarker=null;}$('#poicard').classList.remove('on');}
function addPicked(){if(lastPicked)addAt(lastPicked.lat,lastPicked.lng,lastPicked.title);}

/* 지도 중심에 물건 추가 */
function addHere(){
  if(!map){openEditor();return;}
  const c=map.getCenter();
  addAt(c.getLat(),c.getLng(),'');
}
function addAt(lat,lng,name){
  clearTemp();
  openEditor();
  cur.lat=lat;cur.lng=lng;
  if(name&&!cur.aptName)cur.aptName=name;
  fillAddressFromCoord(lat,lng);
  renderPanes();
}
/* 좌표 → 구조화된 주소(시도/시군구/읍면동/지번/도로명)로 채움.
   행정구역은 카카오가 돌려주는 region_1~3depth 값을 그대로 쓴다.
   (도로명주소를 공백으로 쪼개면 읍면동 자리에 도로명이 들어가므로 쓰지 않는다) */
function stripSido(s){
  return String(s||'').replace('특별자치시','').replace('특별자치도','')
    .replace('특별시','').replace('광역시','').trim();
}
function fillAddressFromCoord(lat,lng){
  if(!geocoder)return;
  geocoder.coord2Address(lng,lat,(res,status)=>{
    if(status!==kakao.maps.services.Status.OK||!res[0]||!cur)return;
    const a=res[0].address, r=res[0].road_address, src=a||r;
    if(src){
      if(!cur.sido)cur.sido=stripSido(src.region_1depth_name);
      if(!cur.sigungu)cur.sigungu=src.region_2depth_name||'';
      if(!cur.emd)cur.emd=src.region_3depth_name||'';
    }
    if(a&&a.address_name&&!cur.jibun)cur.jibun=a.address_name;
    if(r&&r.address_name&&!cur.road)cur.road=r.address_name;
    if(curTab==='basic')renderPanes();
  });
}

/* ---- 주소로 좌표 찾기 (편집 화면) ---- */
function geocodeCurrent(){
  if(!geocoder)return toast('지도가 준비되지 않았습니다. 지도 탭에서 키를 먼저 등록해 주세요.');
  const q=(cur.road||'').trim()||(cur.jibun||'').trim()||
          [cur.sido,cur.sigungu,cur.emd,cur.jibun].filter(Boolean).join(' ').trim();
  if(!q)return toast('먼저 주소를 입력해 주세요');
  toast('주소로 위치를 찾는 중...');
  geocoder.addressSearch(q,(res,status)=>{
    if(status===kakao.maps.services.Status.OK&&res[0]){
      cur.lat=parseFloat(res[0].y);cur.lng=parseFloat(res[0].x);
      fillAddressFromCoord(cur.lat,cur.lng);
      renderPanes();toast('위치를 찾았습니다');
    }else{
      // 주소로 안 되면 아파트명 키워드로 재시도
      const kw=[cur.sigungu,cur.emd,cur.aptName].filter(Boolean).join(' ').trim();
      if(kw&&places){
        places.keywordSearch(kw,(pres,pstatus)=>{
          if(pstatus===kakao.maps.services.Status.OK&&pres[0]){
            cur.lat=parseFloat(pres[0].y);cur.lng=parseFloat(pres[0].x);
            fillAddressFromCoord(cur.lat,cur.lng);
            renderPanes();toast('아파트명으로 위치를 찾았습니다');
          }else toast('주소를 찾지 못했습니다. 지도에서 직접 지정해 주세요.');
        });
      }else toast('주소를 찾지 못했습니다. 지도에서 직접 지정해 주세요.');
    }
  });
}
function useMyLocationForRecord(){
  if(!navigator.geolocation)return toast('이 기기에서는 위치를 쓸 수 없습니다');
  toast('현재 위치를 찾는 중...');
  navigator.geolocation.getCurrentPosition(p=>{
    cur.lat=p.coords.latitude;cur.lng=p.coords.longitude;
    fillAddressFromCoord(cur.lat,cur.lng);
    renderPanes();toast('현재 위치로 지정했습니다');
  },err=>toast(err.code===1?'위치 권한이 거부되어 있습니다':'위치를 찾지 못했습니다'),
  {enableHighAccuracy:true,timeout:8000});
}
function clearLoc(){cur.lat=null;cur.lng=null;renderPanes();toast('위치를 지웠습니다');}

/* ---- 지도에서 직접 지정 ---- */
function openPicker(){
  if(!kakaoKey()||!window.kakao||!window.kakao.maps)
    return toast('지도가 준비되지 않았습니다. 지도 탭에서 키를 먼저 등록해 주세요.');
  $('#picker').classList.add('open');
  const c=(cur.lat&&cur.lng)?{lat:cur.lat,lng:cur.lng}:(lastCenter||SEOUL);
  setTimeout(()=>{
    if(!pickMap){
      pickMap=new kakao.maps.Map($('#pickMap'),{center:new kakao.maps.LatLng(c.lat,c.lng),level:3});
    }else{
      pickMap.relayout();
      pickMap.setCenter(new kakao.maps.LatLng(c.lat,c.lng));
    }
    pickMap.relayout();
  },80);
}
function closePicker(){$('#picker').classList.remove('open');}
function confirmPick(){
  if(!pickMap)return closePicker();
  const c=pickMap.getCenter();
  cur.lat=c.getLat();cur.lng=c.getLng();
  fillAddressFromCoord(cur.lat,cur.lng);
  closePicker();renderPanes();toast('위치를 지정했습니다');
}

/* ============================ VIEW SWITCH ============================ */
function setView(v){
  curView=v;
  $('#mapView').classList.toggle('on',v==='map');
  $('#listView').classList.toggle('on',v==='list');
  $('#segMap').classList.toggle('on',v==='map');
  $('#segList').classList.toggle('on',v==='list');
  if(v==='map'&&map)setTimeout(()=>map.relayout(),60);
}

/* ============================ LIST ============================ */
function renderList(){
  const q=($('#q').value||'').trim().toLowerCase();
  let arr=[...RECORDS].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(q)arr=arr.filter(r=>[r.code,r.aptName,r.sido,r.sigungu,r.emd,r.jibun,r.road,r.story].join(' ').toLowerCase().includes(q));
  $('#stTotal').textContent=RECORDS.length;
  let photos=0,itv=0;RECORDS.forEach(r=>{photos+=(r.photos?.length||0)+(r.videos?.length||0);itv+=(r.interviews?.length||0);});
  $('#stPhoto').textContent=photos;$('#stItv').textContent=itv;
  const el=$('#list');
  if(!arr.length){el.innerHTML=`<div class="empty"><div class="big">🏙️</div>
    ${RECORDS.length?'검색 결과가 없습니다':'아직 등록한 임장 물건이 없습니다.<br>아래 <b>＋ 임장 물건 추가</b>로 시작하세요.'}</div>`;return;}
  el.innerHTML='';
  arr.forEach(async r=>{
    const c=document.createElement('div');c.className='card';c.onclick=()=>openEditor(r.id);
    const ratio=jeonseRatio(r.sale,r.jeonse), pp=pyeongPrice(r.sale,r.pyeong);
    let thumbHtml='';
    if(r.photos&&r.photos.length){const m=await idbGet('media',r.photos[0]);if(m)thumbHtml=`<img class="thumb" src="${URL.createObjectURL(m.blob)}">`;}
    c.innerHTML=`${thumbHtml}
      ${r.ranking?`<div class="rank">★ ${esc(r.ranking)}</div>`:''}
      <span class="code">${esc(r.code||'코드미지정')}</span>
      <h3>${esc(r.aptName||'(이름 미입력)')}</h3>
      <div class="addr">${esc([r.sido,r.sigungu,r.emd].filter(Boolean).join(' ')||r.road||r.jibun||'주소 미입력')}</div>
      <div class="row">
        ${r.lat&&r.lng?`<span class="badge p">📍 위치</span>`:''}
        ${r.pyeong?`<span class="badge"><b>${esc(r.pyeong)}</b>평</span>`:''}
        ${r.sale?`<span class="badge">매매 <b>${comma(r.sale)}</b></span>`:''}
        ${r.jeonse?`<span class="badge">전세 <b>${comma(r.jeonse)}</b></span>`:''}
        ${ratio?`<span class="badge g">전세가율 <b>${ratio.toFixed(0)}%</b></span>`:''}
        ${pp?`<span class="badge">평단 <b>${pp.toFixed(0)}</b></span>`:''}
        ${(r.photos?.length||r.videos?.length)?`<span class="badge">📷 ${(r.photos?.length||0)+(r.videos?.length||0)}</span>`:''}
      </div>`;
    el.appendChild(c);
  });
}

/* ============================ EDITOR ============================ */
function buildTabs(){
  const tb=$('#tabbar');tb.innerHTML='';
  TABS.forEach(([k,label])=>{const b=document.createElement('button');b.className='tab'+(k===curTab?' on':'');
    b.textContent=label;b.onclick=()=>{curTab=k;buildTabs();renderPanes();};tb.appendChild(b);});
}
function openEditor(id){
  cur = id ? JSON.parse(JSON.stringify(RECORDS.find(r=>r.id===id))) : blank();
  curTab='basic';
  $('#edTitle').textContent = id ? (cur.code||cur.aptName||'물건 편집') : '새 물건';
  $('#delBtn').style.display = id ? 'block' : 'none';
  buildTabs();renderPanes();
  $('#sheet').classList.add('open');
  $('#sheetbody').scrollTop=0;
  $('#poicard').classList.remove('on');
}
function closeEditor(){$('#sheet').classList.remove('open');cur=null;}

function F(label,key,type='text',placeholder='',opts){
  const val=esc(cur[key]??'');
  if(type==='textarea')return `<div class="field"><label>${label}</label><textarea data-k="${key}" placeholder="${placeholder}">${val}</textarea></div>`;
  if(type==='select'){let o=opts.map(x=>`<option ${x===cur[key]?'selected':''}>${x}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-k="${key}"><option value=""></option>${o}</select></div>`;}
  return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" inputmode="${type==='number'?'decimal':'text'}" value="${val}" placeholder="${placeholder}"></div>`;
}
function bindInputs(root){
  root.querySelectorAll('[data-k]').forEach(el=>{
    el.oninput=()=>{cur[el.dataset.k]=el.value;liveCalc();};
    el.onchange=()=>{cur[el.dataset.k]=el.value;liveCalc();};
  });
}
function liveCalc(){
  const r=jeonseRatio(cur.sale,cur.jeonse), pp=pyeongPrice(cur.sale,cur.pyeong), gap=num(cur.areaPP)-pp;
  const box=document.getElementById('priceCalc');
  if(box)box.innerHTML=`전세가율 <b>${r?r.toFixed(1)+'%':'-'}</b> · 물건 평단가 <b>${pp?pp.toFixed(0)+' 만원/평':'-'}</b>`+
    (num(cur.areaPP)?` · 지역대비 차익 <b>${gap>=0?'+':''}${gap.toFixed(0)} 만원/평 ${gap>=0?'(저평가)':'(고평가)'}</b>`:'');
}

/* ----- media ----- */
async function addMedia(e,kind){
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    const isVideo=(kind==='video')||(kind==='auto'&&f.type.startsWith('video'));
    const mid=uid();
    await idbPut('media',{id:mid,recordId:cur.id,type:isVideo?'video':'photo',blob:f,name:f.name||'',ts:Date.now()});
    if(isVideo)cur.videos.push(mid);else cur.photos.push(mid);
  }
  renderMedia();toast(files.length+'개 추가됨');
}
async function renderMedia(){
  const g=$('#mediaGrid');if(!g)return;
  const ids=[...(cur.photos||[]).map(id=>['photo',id]),...(cur.videos||[]).map(id=>['video',id])];
  if(!ids.length){g.innerHTML='<div class="mini" style="grid-column:1/-1">아직 사진·영상이 없습니다.</div>';return;}
  g.innerHTML='';
  for(const [type,id] of ids){
    const m=await idbGet('media',id);if(!m)continue;
    const url=URL.createObjectURL(m.blob);
    const d=document.createElement('div');d.className='media-item';
    d.innerHTML = type==='video'
      ? `<video src="${url}" muted></video><span class="vtag">▶ 영상</span><button class="del" onclick="delMedia('${id}','video',event)">×</button>`
      : `<img src="${url}"><button class="del" onclick="delMedia('${id}','photo',event)">×</button>`;
    d.onclick=(ev)=>{if(ev.target.classList.contains('del'))return;openViewer(type,url);};
    g.appendChild(d);
  }
}
async function delMedia(id,type,ev){ev.stopPropagation();
  await idbDel('media',id);
  if(type==='video')cur.videos=cur.videos.filter(x=>x!==id);else cur.photos=cur.photos.filter(x=>x!==id);
  renderMedia();
}
function openViewer(type,url){$('#viewerBody').innerHTML=type==='video'?`<video src="${url}" controls autoplay></video>`:`<img src="${url}">`;$('#viewer').classList.add('open');}
function closeViewer(){$('#viewer').classList.remove('open');$('#viewerBody').innerHTML='';}

/* ----- save / delete ----- */
async function persist(){
  cur.updatedAt=Date.now();
  const idx=RECORDS.findIndex(r=>r.id===cur.id);
  const clean=JSON.parse(JSON.stringify(cur));
  await idbPut('records',clean);
  if(idx>=0)RECORDS[idx]=clean;else RECORDS.push(clean);
  refreshPins();renderList();
  toast('저장되었습니다');
  closeEditor();
}
async function saveRecord(){
  if(!cur)return;
  if(!cur.code)cur.code=makeCode(cur.sido);
  // 위치가 없으면 주소로 한 번 자동 조회 후 저장
  const addr=(cur.road||'').trim()||(cur.jibun||'').trim();
  if((!cur.lat||!cur.lng)&&addr&&geocoder){
    geocoder.addressSearch(addr,(res,status)=>{
      if(status===kakao.maps.services.Status.OK&&res[0]){
        cur.lat=parseFloat(res[0].y);cur.lng=parseFloat(res[0].x);
      }
      persist();
    });
    return;
  }
  persist();
}
async function deleteRecord(){
  if(!cur)return;
  if(!confirm('이 물건과 첨부 사진·영상을 모두 삭제할까요?'))return;
  for(const id of [...(cur.photos||[]),...(cur.videos||[])])await idbDel('media',id);
  await idbDel('records',cur.id);
  RECORDS=RECORDS.filter(r=>r.id!==cur.id);
  closeEditor();refreshPins();renderList();toast('삭제되었습니다');
}

}
function blobToDataURL(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);});}
function dataURLtoBlob(d){const [h,b64]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
async function exportBackup(){
  toast('백업 파일 생성 중...');
  const media=await idbAll('media');
  const mediaOut=[];
  for(const m of media)mediaOut.push({id:m.id,recordId:m.recordId,type:m.type,name:m.name,data:await blobToDataURL(m.blob)});
  const payload={app:'saeam-imjang',version:APP_VERSION,exportedAt:new Date().toISOString(),records:RECORDS,media:mediaOut};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='임장노트_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('백업 완료 · 카톡 나에게 보내기 권장');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(!data.records)throw 0;
      if(!confirm('현재 데이터에 백업을 병합합니다. 계속할까요?'))return;
      for(const m of (data.media||[]))await idbPut('media',{id:m.id,recordId:m.recordId,type:m.type,name:m.name,blob:dataURLtoBlob(m.data),ts:Date.now()});
      for(const r of data.records){await idbPut('records',r);if(!RECORDS.find(x=>x.id===r.id))RECORDS.push(r);}
      renderList();refreshPins();toast('복원 완료: '+data.records.length+'건');
    }catch(err){alert('백업 파일을 읽을 수 없습니다.');}
  };
  inp.click();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
