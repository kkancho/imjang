<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>새암 임장노트</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f1a16; --panel:#16241e; --panel2:#1d3129; --line:#2a4438;
  --txt:#eaf3ef; --sub:#9fbcb0; --accent:#2fbf87; --accent2:#26a173;
  --warn:#e5b567; --danger:#e06c6c; --chip:#22392f; --gold:#e8c66a;
  --safe-top:env(safe-area-inset-top); --safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#12211c,#12211ccc);
  backdrop-filter:blur(8px);padding:calc(var(--safe-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo small{font-weight:500;color:var(--sub);font-size:12px;margin-left:4px}
.spacer{flex:1}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:8px 11px;font-size:14px;cursor:pointer}
.iconbtn:active{transform:scale(.96)}
main{flex:1;padding:14px 14px calc(90px + var(--safe-bot))}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:11px 13px;outline:none}
.search input:focus{border-color:var(--accent)}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--sub);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;cursor:pointer;position:relative;overflow:hidden}
.card:active{border-color:var(--accent)}
.card .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.card .code{display:inline-block;background:var(--chip);color:var(--accent);border:1px solid var(--line);
  border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.card h3{margin:2px 0 3px;font-size:16px}
.card .addr{color:var(--sub);font-size:13px}
.card .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--sub)}
.badge b{color:var(--txt)}
.badge.g{border-color:#2f7a5a;color:#8fe0bd}
.rank{position:absolute;top:11px;right:11px;background:var(--gold);color:#3a2c00;font-weight:800;
  border-radius:8px;padding:2px 8px;font-size:12px}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
.empty .big{font-size:44px;margin-bottom:12px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-bot));
  z-index:30;background:var(--accent);color:#04120b;border:none;border-radius:16px;
  padding:15px 26px;font-size:16px;font-weight:800;box-shadow:0 8px 24px #0008;cursor:pointer;max-width:612px;width:calc(100% - 28px)}
.fab:active{background:var(--accent2)}
/* editor */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.open{display:flex}
.sheethead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;z-index:5}
.sheethead b{font-size:16px;flex:1;text-align:center}
.sheetbody{flex:1;overflow-y:auto;padding:12px 14px calc(30px + var(--safe-bot));-webkit-overflow-scrolling:touch}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;position:sticky;top:0;background:var(--bg);z-index:4}
.tabbar::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--sub);
  border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);color:#04120b;border-color:var(--accent);font-weight:700}
.pane{display:none;animation:fade .2s}
.pane.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.grp h4{margin:0 0 10px;font-size:14px;color:var(--accent)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.two{display:flex;gap:9px}.two>*{flex:1}
.three{display:flex;gap:9px}.three>*{flex:1}
.calc{background:var(--chip);border:1px dashed #2f7a5a;border-radius:10px;padding:8px 11px;font-size:13px;color:#8fe0bd;margin-bottom:11px}
.calc b{color:#fff}
.mini{font-size:11.5px;color:var(--sub);margin-top:-4px;margin-bottom:9px}
.addbtn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--accent);
  border-radius:10px;padding:11px;cursor:pointer;font-weight:600;margin-top:2px}
.addbtn:active{background:var(--chip)}
.subcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;position:relative}
.subcard .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer}
/* media */
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.media-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.media-item .vtag{position:absolute;left:5px;bottom:5px;background:#000a;border-radius:5px;padding:1px 6px;font-size:11px}
.media-item .del{position:absolute;top:4px;right:4px;background:#000b;border:none;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.mediabtns{display:flex;gap:8px;margin-bottom:11px}
.mediabtns label{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px;cursor:pointer;color:var(--accent);font-weight:600}
.savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:11px 14px calc(11px + var(--safe-bot));display:flex;gap:9px}
.savebar button{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
.btn-save{background:var(--accent);color:#04120b}
.btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 90px}
.chkline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.chkline:last-child{border:none}
.chkline input{width:20px;height:20px;margin-top:1px;flex:0 0 auto;accent-color:var(--accent)}
.chkline span{font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bot));transform:translateX(-50%);
  background:#04120b;border:1px solid var(--accent);color:var(--accent);padding:11px 20px;border-radius:12px;
  z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;font-size:14px}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;background:#000e;z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.viewer.open{display:flex}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:12px}
.viewer .close{position:absolute;top:calc(var(--safe-top) + 12px);right:16px;background:#fff2;border:none;color:#fff;
  border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.foot{color:var(--sub);font-size:11px;text-align:center;padding:14px 0 4px}
.hint{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <div class="logo">새암 임장노트 <small id="ver">v0.1</small></div>
      <div class="spacer"></div>
      <button class="iconbtn" onclick="openBackup()">⤓ 백업</button>
    </div>
  </header>
  <main>
    <div class="search">
      <input id="q" type="search" placeholder="코드·아파트명·지역 검색 (예: SEO-0001, 공릉)" oninput="renderList()">
    </div>
    <div class="stats">
      <div class="stat"><b id="stTotal">0</b><span>등록 물건</span></div>
      <div class="stat"><b id="stPhoto">0</b><span>사진·영상</span></div>
      <div class="stat"><b id="stItv">0</b><span>인터뷰</span></div>
    </div>
    <div id="list"></div>
  </main>
  <button class="fab" onclick="openEditor()">＋ 임장 물건 추가</button>
</div>

<!-- ===== Editor Sheet ===== -->
<div class="sheet" id="sheet">
  <div class="sheethead">
    <button class="iconbtn" onclick="closeEditor()">← 닫기</button>
    <b id="edTitle">새 물건</b>
    <button class="iconbtn" onclick="saveRecord()">저장</button>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="sheetbody" id="sheetbody"></div>
  <div class="savebar">
    <button class="btn-del" id="delBtn" onclick="deleteRecord()" style="display:none">삭제</button>
    <button class="btn-save" onclick="saveRecord()">저장하기</button>
  </div>
</div>

<!-- backup viewer -->
<div class="viewer" id="viewer" onclick="if(event.target.id==='viewer')closeViewer()">
  <button class="close" onclick="closeViewer()">×</button>
  <div id="viewerBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   새암 임장노트 — 로컬 우선(IndexedDB) / 클라우드 이관 대비 구조
   데이터 모델은 구글시트(단지정보·매물정보·가격비교·시세트래킹)를 반영
   ============================================================ */
const APP_VERSION='v0.1';
document.getElementById('ver').textContent=APP_VERSION;

/* ---------- IndexedDB (저장소 추상화: 나중에 Supabase로 교체 지점) ---------- */
const DB_NAME='saeam_imjang', DB_VER=1;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});
    if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=e=>rej(e);
});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function idbAll(store){return new Promise((res)=>{const out=[];const c=tx(store,'readonly').openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};});}
function idbGet(store,id){return new Promise(res=>{const r=tx(store,'readonly').get(id);r.onsuccess=()=>res(r.result);});}
function idbPut(store,val){return new Promise(res=>{const r=tx(store,'readwrite').put(val);r.onsuccess=()=>res(true);});}
function idbDel(store,id){return new Promise(res=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res(true);});}

/* ---------- state ---------- */
let RECORDS=[];       // all records (media stored separately by id)
let cur=null;         // record being edited
let curTab='basic';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- code generator: 지역약칭 + 일련번호 ---------- */
const REGION_ABBR={'서울':'SEO','부산':'BSN','대구':'DGU','인천':'ICN','광주':'GWJ','대전':'DJN','울산':'ULS',
  '세종':'SJG','경기':'GGD','강원':'GWD','충북':'CHB','충남':'CHN','전북':'JBK','전남':'JNM','경북':'GBK',
  '경남':'GNM','제주':'JJU'};
function makeCode(sido){
  let ab='REG';
  if(sido){for(const k in REGION_ABBR){if(sido.includes(k)){ab=REGION_ABBR[k];break;}}}
  const same=RECORDS.filter(r=>r.code&&r.code.startsWith(ab+'-'));
  let max=0;same.forEach(r=>{const n=parseInt(r.code.split('-')[1]||'0',10);if(n>max)max=n;});
  return ab+'-'+String(max+1).padStart(4,'0');
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const comma=n=>n?Number(n).toLocaleString('ko-KR'):'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
// 전세가율(%) = 전세/매매*100 ; 평단가(만원/평)=가격(만원)/평형
function jeonseRatio(sale,jeonse){sale=num(sale);jeonse=num(jeonse);return sale>0?(jeonse/sale*100):0;}
function pyeongPrice(price,py){price=num(price);py=num(py);return py>0?(price/py):0;}

/* ---------- blank record ---------- */
function blank(){return{
  id:uid(),code:'',createdAt:Date.now(),updatedAt:Date.now(),
  aptName:'',sido:'',sigungu:'',emd:'',jibun:'',road:'',bjd:'',
  // 입지
  subway:'',trait:'',moveIn:'',unsold:'',jobs:'',transit:'',amenity:'',nature:'',jimok:'',school:'',story:'',
  // 단지
  far:'',supply:'',exclusive:'',pyeong:'',households:'',parking:'',parkingPer:'',corridor:'',
  // 가격비교
  sale:'',jeonse:'',areaPP:'',grade:'',ranking:'',
  // 매물(복수)
  listings:[],
  // 시세트래킹(복수)
  tracks:[],
  // 인터뷰(복수)
  interviews:[],
  memo:'',
  checklist:{},
  photos:[],videos:[]
};}

/* ---------- tabs ---------- */
const TABS=[
  ['basic','기본·입지'],['complex','단지'],['listing','매물'],
  ['price','가격비교'],['track','시세트래킹'],['media','사진·영상'],
  ['interview','인터뷰·메모'],['check','임장 체크리스트']
];

/* ---------- init ---------- */
(async function(){
  await openDB();
  RECORDS=await idbAll('records');
  buildTabs();
  renderList();
})();

/* ============================ LIST ============================ */
async function mediaCount(){let p=0,v=0;RECORDS.forEach(r=>{p+=(r.photos?.length||0)+(r.videos?.length||0);});return p;}
function renderList(){
  const q=($('#q').value||'').trim().toLowerCase();
  let arr=[...RECORDS].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(q)arr=arr.filter(r=>[r.code,r.aptName,r.sido,r.sigungu,r.emd,r.jibun,r.road,r.story].join(' ').toLowerCase().includes(q));
  // stats
  $('#stTotal').textContent=RECORDS.length;
  let photos=0,itv=0;RECORDS.forEach(r=>{photos+=(r.photos?.length||0)+(r.videos?.length||0);itv+=(r.interviews?.length||0);});
  $('#stPhoto').textContent=photos;$('#stItv').textContent=itv;
  const el=$('#list');
  if(!arr.length){el.innerHTML=`<div class="empty"><div class="big">🏙️</div>
    ${RECORDS.length?'검색 결과가 없습니다':'아직 등록한 임장 물건이 없습니다.<br>아래 <b>＋ 임장 물건 추가</b>로 시작하세요.'}</div>`;return;}
  el.innerHTML='';
  arr.forEach(async r=>{
    const c=document.createElement('div');c.className='card';c.onclick=()=>openEditor(r.id);
    const ratio=jeonseRatio(r.sale,r.jeonse);
    const pp=pyeongPrice(r.sale,r.pyeong);
    let thumbHtml='';
    if(r.photos&&r.photos.length){const m=await idbGet('media',r.photos[0]);if(m)thumbHtml=`<img class="thumb" src="${URL.createObjectURL(m.blob)}">`;}
    c.innerHTML=`${thumbHtml}
      ${r.ranking?`<div class="rank">★ ${r.ranking}</div>`:''}
      <span class="code">${r.code||'코드미지정'}</span>
      <h3>${r.aptName||'(이름 미입력)'}</h3>
      <div class="addr">${[r.sido,r.sigungu,r.emd].filter(Boolean).join(' ')||r.road||r.jibun||'주소 미입력'}</div>
      <div class="row">
        ${r.pyeong?`<span class="badge"><b>${r.pyeong}</b>평</span>`:''}
        ${r.sale?`<span class="badge">매매 <b>${comma(r.sale)}</b></span>`:''}
        ${r.jeonse?`<span class="badge">전세 <b>${comma(r.jeonse)}</b></span>`:''}
        ${ratio?`<span class="badge g">전세가율 <b>${ratio.toFixed(0)}%</b></span>`:''}
        ${pp?`<span class="badge">평단 <b>${pp.toFixed(0)}</b></span>`:''}
        ${r.photos?.length||r.videos?.length?`<span class="badge">📷 ${(r.photos?.length||0)+(r.videos?.length||0)}</span>`:''}
      </div>`;
    el.appendChild(c);
  });
}

/* ============================ EDITOR ============================ */
function buildTabs(){
  const tb=$('#tabbar');tb.innerHTML='';
  TABS.forEach(([k,label])=>{const b=document.createElement('button');b.className='tab'+(k===curTab?' on':'');
    b.textContent=label;b.onclick=()=>{curTab=k;buildTabs();renderPanes();};tb.appendChild(b);});
}
function openEditor(id){
  cur = id ? JSON.parse(JSON.stringify(RECORDS.find(r=>r.id===id))) : blank();
  cur._isNew = !id;
  curTab='basic';
  $('#edTitle').textContent = id ? (cur.code||cur.aptName||'물건 편집') : '새 물건';
  $('#delBtn').style.display = id ? 'block' : 'none';
  buildTabs();renderPanes();
  $('#sheet').classList.add('open');
  $('#sheetbody').scrollTop=0;
}
function closeEditor(){$('#sheet').classList.remove('open');cur=null;}

/* bind helper: reads back into cur on input */
function F(label,key,type='text',placeholder='',opts){
  const val=cur[key]??'';
  if(type==='textarea')return `<div class="field"><label>${label}</label><textarea data-k="${key}" placeholder="${placeholder}">${val}</textarea></div>`;
  if(type==='select'){let o=opts.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('');
    return `<div class="field"><label>${label}</label><select data-k="${key}"><option value=""></option>${o}</select></div>`;}
  return `<div class="field"><label>${label}</label><input data-k="${key}" type="${type}" inputmode="${type==='number'?'decimal':'text'}" value="${val}" placeholder="${placeholder}"></div>`;
}
function bindInputs(root){
  root.querySelectorAll('[data-k]').forEach(el=>{
    el.oninput=()=>{cur[el.dataset.k]=el.value;liveCalc();};
    el.onchange=()=>{cur[el.dataset.k]=el.value;liveCalc();};
  });
}
function liveCalc(){
  // 가격비교 계산 표시 갱신
  const r=jeonseRatio(cur.sale,cur.jeonse);
  const pp=pyeongPrice(cur.sale,cur.pyeong);
  const gap=num(cur.areaPP)-pp;
  const box=document.getElementById('priceCalc');
  if(box)box.innerHTML=`전세가율 <b>${r?r.toFixed(1)+'%':'-'}</b> · 물건 평단가 <b>${pp?pp.toFixed(0)+' 만원/평':'-'}</b>`+
    (num(cur.areaPP)?` · 지역대비 차익 <b>${gap>=0?'+':''}${gap.toFixed(0)} 만원/평 ${gap>=0?'(저평가)':'(고평가)'}</b>`:'');
}

function renderPanes(){
  const body=$('#sheetbody');
  let html='';
  if(curTab==='basic'){
    html=`
    <div class="grp"><h4>기본 정보</h4>

/* ----- media ----- */
async function addMedia(e,kind){
  const files=[...e.target.files];e.target.value='';
  for(const f of files){
    const isVideo=(kind==='video')||(kind==='auto'&&f.type.startsWith('video'));
    const mid=uid();
    await idbPut('media',{id:mid,recordId:cur.id,type:isVideo?'video':'photo',blob:f,name:f.name||'',ts:Date.now()});
    if(isVideo)cur.videos.push(mid);else cur.photos.push(mid);
  }
  renderMedia();toast(files.length+'개 추가됨');
}
async function renderMedia(){
  const g=$('#mediaGrid');if(!g)return;
  const ids=[...(cur.photos||[]).map(id=>['photo',id]),...(cur.videos||[]).map(id=>['video',id])];
  if(!ids.length){g.innerHTML='<div class="mini" style="grid-column:1/-1">아직 사진·영상이 없습니다.</div>';return;}
  g.innerHTML='';
  for(const [type,id] of ids){
    const m=await idbGet('media',id);if(!m)continue;
    const url=URL.createObjectURL(m.blob);
    const d=document.createElement('div');d.className='media-item';
    d.innerHTML = type==='video'
      ? `<video src="${url}" muted></video><span class="vtag">▶ 영상</span><button class="del" onclick="delMedia('${id}','video',event)">×</button>`
      : `<img src="${url}"><button class="del" onclick="delMedia('${id}','photo',event)">×</button>`;
    d.onclick=(ev)=>{if(ev.target.classList.contains('del'))return;openViewer(type,url);};
    g.appendChild(d);
  }
}
async function delMedia(id,type,ev){ev.stopPropagation();
  await idbDel('media',id);
  if(type==='video')cur.videos=cur.videos.filter(x=>x!==id);else cur.photos=cur.photos.filter(x=>x!==id);
  renderMedia();
}
function openViewer(type,url){$('#viewerBody').innerHTML=type==='video'?`<video src="${url}" controls autoplay></video>`:`<img src="${url}">`;$('#viewer').classList.add('open');}
function closeViewer(){$('#viewer').classList.remove('open');$('#viewerBody').innerHTML='';}

/* ----- save / delete ----- */
async function saveRecord(){
  // pull latest bound values already in cur; ensure code
  if(!cur.code)cur.code=makeCode(cur.sido);
  cur.updatedAt=Date.now();
  const idx=RECORDS.findIndex(r=>r.id===cur.id);
  const clean=JSON.parse(JSON.stringify(cur));delete clean._isNew;
  await idbPut('records',clean);
  if(idx>=0)RECORDS[idx]=clean;else RECORDS.push(clean);
  toast('저장되었습니다');
  closeEditor();renderList();
}
async function deleteRecord(){
  if(!cur)return;
  if(!confirm('이 물건과 첨부 사진·영상을 모두 삭제할까요?'))return;
  for(const id of [...(cur.photos||[]),...(cur.videos||[])])await idbDel('media',id);
  await idbDel('records',cur.id);
  RECORDS=RECORDS.filter(r=>r.id!==cur.id);
  closeEditor();renderList();toast('삭제되었습니다');
}

/* ============================ BACKUP ============================ */
async function openBackup(){
  const choice=prompt('백업/복원\n\n1 = 백업 파일 내려받기 (사진·영상 포함)\n2 = 백업 파일 불러오기(복원)\n\n번호를 입력하세요','1');
  if(choice==='1')exportBackup();
  else if(choice==='2')importBackup();
}
function blobToDataURL(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b);});}
function dataURLtoBlob(d){const [h,b64]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
async function exportBackup(){
  toast('백업 파일 생성 중...');
  const media=await idbAll('media');
  const mediaOut=[];
  for(const m of media)mediaOut.push({id:m.id,recordId:m.recordId,type:m.type,name:m.name,data:await blobToDataURL(m.blob)});
  const payload={app:'saeam-imjang',version:APP_VERSION,exportedAt:new Date().toISOString(),records:RECORDS,media:mediaOut};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='임장노트_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('백업 완료 · 카톡 나에게 보내기 권장');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const data=JSON.parse(await f.text());
      if(!data.records)throw 0;
      if(!confirm('현재 데이터에 백업을 병합합니다. 계속할까요?'))return;
      for(const m of (data.media||[]))await idbPut('media',{id:m.id,recordId:m.recordId,type:m.type,name:m.name,blob:dataURLtoBlob(m.data),ts:Date.now()});
      for(const r of data.records){await idbPut('records',r);if(!RECORDS.find(x=>x.id===r.id))RECORDS.push(r);}
      renderList();toast('복원 완료: '+data.records.length+'건');
    }catch(err){alert('백업 파일을 읽을 수 없습니다.');}
  };
  inp.click();
}
